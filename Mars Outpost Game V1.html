<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Mars Outpost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one fixed 1280x720 pixel-art stage, scaled to fit the window. HUD on top, action bar on the bottom, panels slide over the scene. */
:root{
  --ink:#0B1026; --ink2:#1A2250; --ink3:#26305E; --line:#3A4372;
  --cream:#FFF6E5; --muted:#A9B1C6; --sun:#FFD84A; --teal:#35CDBB;
  --red:#C8433C; --alarm:#FF3B30; --green:#6BE08A; --orange:#E2702F; --purple:#9F7AEA; --sky:#4FC3F7;
  --px:"Press Start 2P", ui-monospace, monospace;
  --ui:Fredoka, "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden}
#wrap{position:fixed;inset:0;background:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;transform-origin:center center;
  font-family:var(--ui);font-weight:600;color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
button{font-family:var(--px);cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.px{font-family:var(--px);font-weight:400}

/* ---------- scene ---------- */
#scene{position:absolute;inset:0}
#scene.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-4px)}100%{transform:translate(0,0)}}
.sky{position:absolute;inset:0}
#skyDay{background:linear-gradient(#FFD6A5,#F6A56E 55%,#E57C42)}
#skyNight{background:linear-gradient(#070A1C,#1A2250 60%,#4A2A4E);opacity:0}
#stars{position:absolute;inset:0 0 200px 0;opacity:0}
#stars i{position:absolute;width:3px;height:3px;background:#FFF6E5}
#sun,#moon{position:absolute;width:110px;height:110px;left:0;top:0}
#sunGlow{position:absolute;left:-20px;top:-20px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(rgba(255,246,208,.9) 0,rgba(255,211,107,.55) 40%,rgba(255,211,107,0) 70%)}
.hill{position:absolute;border-radius:50%}
#ground{position:absolute;left:0;bottom:0;width:1280px;height:200px;background:linear-gradient(#CB5E2E,#9C3A17)}
.rock{position:absolute;background:#8A3A1B;clip-path:polygon(0 100%,0 60%,20% 60%,20% 30%,60% 30%,60% 0,80% 0,80% 40%,100% 40%,100% 100%)}
.bld{position:absolute;cursor:pointer}
.bld svg{display:block}
#dome{left:430px;bottom:190px;width:380px;height:200px;background:#FFF6E5;
  clip-path:polygon(0 200px,0 140px,20px 140px,20px 90px,40px 90px,40px 60px,60px 60px,60px 40px,80px 40px,80px 30px,100px 30px,100px 20px,120px 20px,120px 10px,140px 10px,140px 0,240px 0,240px 10px,260px 10px,260px 20px,280px 20px,280px 30px,300px 30px,300px 40px,320px 40px,320px 60px,340px 60px,340px 90px,360px 90px,360px 140px,380px 140px,380px 200px);cursor:default}
#domeGlass{position:absolute;inset:10px 10px 0;background:linear-gradient(#C8F0FC,#78C8E2);
  clip-path:polygon(0 190px,0 130px,20px 130px,20px 80px,40px 80px,40px 60px,60px 60px,60px 40px,80px 40px,80px 30px,100px 30px,100px 10px,140px 10px,140px 0,220px 0,220px 10px,260px 10px,260px 30px,280px 30px,280px 40px,300px 40px,300px 60px,320px 60px,320px 80px,340px 80px,340px 130px,360px 130px,360px 190px)}
.shine{position:absolute;height:8px;background:rgba(255,255,255,.5)}
.crew{position:absolute;bottom:0;width:18px;height:50px;animation:walk 6s ease-in-out infinite}
.crew b{display:block;width:18px;height:18px;background:#F5CDA6;box-shadow:inset -4px 0 0 rgba(0,0,0,.14)}
.crew u{display:block;width:18px;height:32px;background:#35CDBB;box-shadow:inset -4px 0 0 rgba(0,0,0,.2)}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
#domeHouse{position:absolute;left:119px;bottom:0;width:130px;height:72px;background:#A9B1C6;box-shadow:inset 0 -8px 0 #7E87A0;
  clip-path:polygon(0 100%,0 22%,8% 22%,8% 0,92% 0,92% 22%,100% 22%,100% 100%)}
#domeHouse i{position:absolute;top:30px;width:28px;height:22px;background:#FFD84A;box-shadow:inset -4px -4px 0 #E0A800}
#pipe{position:absolute;left:370px;bottom:222px;width:70px;height:14px;background:#8890A8;box-shadow:inset 0 -4px 0 #5C6480,inset 0 4px 0 #B9C0D4}
#pods{left:250px;bottom:190px;width:120px;height:130px}
#podBadge{position:absolute;right:-6px;top:-8px;font:11px var(--px);background:var(--ink);color:var(--green);padding:5px 6px;border:2px solid var(--green)}
#podBar{position:absolute;left:14px;right:14px;bottom:-14px;height:6px;background:rgba(11,16,38,.6)}
#podBar i{display:block;height:100%;width:0;background:var(--green)}
#hab{left:880px;bottom:190px;width:240px;height:168px;cursor:default}
#solar{position:absolute;left:812px;bottom:190px;width:64px;height:40px;display:none}
#mine{left:1134px;bottom:190px;width:140px;height:100px}
#rocket{left:30px;bottom:190px;width:80px;height:220px}
#rocket.launch{transition:transform 4s cubic-bezier(.5,0,.9,.4);transform:translateY(-900px)}
.bubble{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--cream);color:var(--ink);font:10px var(--px);
  padding:6px 8px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:bob 1s ease-in-out infinite;pointer-events:none}
.bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--cream)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#nightTint{position:absolute;inset:0;background:#141846;opacity:0;pointer-events:none;mix-blend-mode:multiply}
#dustTint{position:absolute;inset:0;background:#C77A3A;opacity:0;pointer-events:none;transition:opacity 2s}
#fx{position:absolute;inset:0;pointer-events:none}
#flareTint{position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,#FFFBE0,#FFD84A 40%,rgba(255,138,61,.4));opacity:0;pointer-events:none;mix-blend-mode:screen}
#flareTint.on{animation:flare 1.4s ease-in-out infinite}
@keyframes flare{0%,100%{opacity:.25}50%{opacity:.5}}
#acts{position:absolute;left:24px;right:24px;bottom:104px;height:58px;display:flex;gap:8px;justify-content:center;z-index:5}
.act{flex:1;max-width:132px;min-width:0;display:flex;gap:6px;align-items:center;padding:4px 7px;background:rgba(11,16,38,.92);border:3px solid #3A4372;border-radius:10px;
  color:var(--cream);text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.35);position:relative;overflow:hidden}
.act:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.act .ai{flex:none}
.act *{pointer-events:none}
.act .at{display:flex;flex-direction:column;gap:3px;min-width:0}
.act b{font:8px var(--px);font-weight:400;white-space:nowrap}
.act em{font:600 11px var(--ui);font-style:normal;display:flex;flex-wrap:wrap;gap:0 5px;line-height:1.2}
.act em .c{color:#FF8A80;display:inline-flex;align-items:center;gap:1px}
.act em .g{color:#8DEB9E;display:inline-flex;align-items:center;gap:1px}
.act.dis{opacity:.45;cursor:not-allowed}
.act.on{border-color:var(--green)}
.act.off{border-color:#5A1E1C}
.act .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--sun)}
.meter .lab span i{font-style:normal;color:#FF8A80;margin-left:4px}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;right:0;height:84px;background:linear-gradient(#0B1026,#1A2250);border-radius:0 0 26px 26px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;gap:22px;align-items:center;padding:0 28px;box-sizing:border-box;z-index:5}
.meter{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.meter .lab{display:flex;align-items:center;gap:8px;font:11px var(--px)}
.meter .lab span{margin-left:auto;color:var(--muted);font-size:10px}
.meter .bar{height:16px;background:rgba(255,255,255,.16);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.meter .bar i{display:block;height:100%;width:50%;transition:width .3s}
.meter.low .bar{animation:lowpulse .8s steps(2) infinite}
@keyframes lowpulse{50%{box-shadow:0 0 0 3px var(--alarm)}}

#dayPanel{position:absolute;right:24px;top:104px;width:270px;background:rgba(11,16,38,.9);border-radius:22px;padding:16px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:11px;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:4}
#dayTitle{display:flex;align-items:baseline;justify-content:space-between;font:18px var(--px);white-space:nowrap}
#dayTitle small{font:10px var(--px);color:var(--muted)}
.dn{display:flex;height:30px;border-radius:999px;overflow:hidden}
.dn div{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;background:#26305E;color:var(--cream)}
.dn div.on{background:var(--sun);color:var(--ink)}
#dayStatus{font-size:15px;line-height:1.35;min-height:21px}
#dayStatus.alert{color:#FF8A80}
.ctrls{display:flex;gap:6px}
.ctrls button{flex:1;height:30px;border-radius:10px;background:#26305E;color:var(--cream);font-size:10px}
.ctrls button.on{background:var(--teal);color:var(--ink)}

#offPanel{position:absolute;left:24px;top:104px;width:250px;background:rgba(11,16,38,.92);border:3px solid var(--cream);padding:12px 14px;box-sizing:border-box;
  display:none;flex-direction:column;gap:9px;z-index:4}
#offPanel h4{margin:0;font:11px var(--px);color:var(--sun)}
.orow{display:grid;grid-template-columns:26px 1fr;gap:4px 8px;align-items:center;font-size:13px}
.orow .st{display:flex;justify-content:space-between}
.orow .st em{font-style:normal;font-size:12px}
.mini{height:6px;background:rgba(255,255,255,.15);grid-column:2}
.mini i{display:block;height:100%}

#banner{position:absolute;left:50%;top:104px;transform:translateX(-50%);width:600px;height:52px;display:none;align-items:center;justify-content:center;
  background:repeating-linear-gradient(-45deg,#FFD84A 0 14px,#0B1026 14px 28px);padding:5px;box-sizing:border-box;border-radius:14px;z-index:4}
#banner div{width:100%;height:100%;background:#7A1E1A;border-radius:10px;display:flex;align-items:center;justify-content:center;font:15px var(--px);color:var(--cream);text-align:center}
#penPanel{position:absolute;left:24px;top:104px;width:270px;background:rgba(60,10,12,.94);border:3px solid var(--alarm);padding:10px 12px;box-sizing:border-box;display:none;flex-direction:column;gap:8px;z-index:4;box-shadow:0 0 0 3px var(--ink)}
#penPanel h4{margin:0;font:10px var(--px);color:#FFD0C8;display:flex;justify-content:space-between;gap:6px}
#penPanel h4 span{color:var(--sun)}
#penPanel ul{margin:0;padding-left:16px;font-size:13px;line-height:1.3;font-weight:500;color:#FFE8E2}
.meter.out .bar{background:repeating-linear-gradient(-45deg,rgba(255,59,48,.55) 0 6px,rgba(11,16,38,.6) 6px 12px);animation:lowpulse .5s steps(2) infinite}
.meter .lab span b{color:var(--alarm);font-weight:400}
#evPanel{position:absolute;right:24px;top:290px;width:270px;background:rgba(11,16,38,.92);border:3px solid var(--cream);padding:12px 14px;box-sizing:border-box;display:none;flex-direction:column;gap:7px;z-index:4}
#evPanel h4{margin:0;font:11px var(--px);color:var(--sun)}
#evPanel .r{display:flex;justify-content:space-between;font-size:13px}
#evPanel .r b{color:#FF8A80;font-weight:600}
#evPanel p{margin:4px 0 0;font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}

#nav{position:absolute;left:0;right:0;bottom:0;height:98px;background:linear-gradient(#1A2250,#0B1026);border-radius:26px 26px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.3);
  display:flex;gap:20px;justify-content:center;align-items:center;z-index:5}
.nb{position:relative;width:196px;height:60px;font-size:13px;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.35);color:var(--ink);transition:transform .08s}
.nb:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.nb .dot{position:absolute;right:-6px;top:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--alarm);color:#fff;font:10px var(--px);display:none;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px var(--ink);animation:bob2 1s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-4px)}}
#bUp{background:linear-gradient(#5FE0D0,#25A99A)} #bMine{background:linear-gradient(#FFA562,#E2702F)} #bQuest{background:linear-gradient(#8DEB9E,#4DBE67)}
#bDef{background:linear-gradient(#C8433C,#8A2420);color:var(--cream)} #bInv{background:linear-gradient(#FFE680,#E0B020)}

/* Captain */
#captain{position:absolute;left:50%;top:170px;transform:translateX(-50%);width:540px;display:none;gap:12px;align-items:flex-start;z-index:30;cursor:pointer}
#captain.low{top:auto;bottom:24px}
#captain .face{flex:none;width:72px;height:72px;background:var(--ink);border:3px solid var(--cream);display:grid;place-items:center}
#captain .say{flex:1;background:var(--cream);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:16px;line-height:1.35;box-shadow:0 5px 0 rgba(0,0,0,.3);position:relative}
#captain .say b{display:block;font:10px var(--px);color:var(--red);margin-bottom:6px}
#captain .say small{display:block;margin-top:8px;font:9px var(--px);color:#6A728C;text-align:right}

/* ---------- overlay panels ---------- */
#overlay{position:absolute;inset:0;display:none;z-index:20}
#overlay.dim{background:rgba(5,8,22,.55)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1A2250;border:4px solid var(--cream);box-shadow:0 0 0 4px var(--ink),0 16px 0 rgba(0,0,0,.35);
  padding:22px 24px;box-sizing:border-box;color:var(--cream)}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mhead h2{margin:0;font:18px var(--px);flex:1}
.x{width:40px;height:40px;background:var(--red);color:var(--cream);font-size:14px;box-shadow:0 0 0 3px var(--cream)}
.full{position:absolute;inset:0;background:linear-gradient(#0B1026,#1A2250);padding:22px 30px;box-sizing:border-box}
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.fhead h2{margin:0;font:22px var(--px);margin-right:20px}
.pill{display:flex;align-items:center;gap:6px;background:#26305E;border-radius:999px;padding:5px 12px 5px 8px;font-size:14px}
.back{margin-left:auto;background:var(--cream);color:var(--ink);font-size:11px;height:44px;padding:0 18px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hint{font-size:14px;color:var(--muted);font-weight:500}

.cols{display:grid;grid-template-columns:300px 300px 1fr;gap:26px;height:600px}
.cols>.col{overflow-y:auto;min-height:0;padding-right:4px;scrollbar-width:thin}
.cols .card{padding:8px 10px;margin-bottom:8px}
.col h3{margin:0 0 12px;height:42px;display:flex;align-items:center;justify-content:center;font:13px var(--px);color:var(--ink);border:3px solid var(--cream)}
.sub{font:10px var(--px);color:var(--muted);margin:10px 0 8px}
.card{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;background:#1C2452;border:3px solid #3A4372;cursor:pointer;min-height:58px;box-sizing:border-box}
.card .nm{font-size:14px;line-height:1.2}
.card .cost{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:3px 9px;align-items:center}
.card .cost span{display:inline-flex;align-items:center;gap:3px}
.card .cost .no{color:#FF8A80}
.card .txt{flex:1;min-width:0}
.card.owned{background:#2F6B45;border-color:#6BE08A}
.card.next{border-color:var(--sun)}
.card.locked{opacity:.55}
.lvl{font:9px var(--px);color:var(--sun);margin-bottom:5px}
.btn{height:36px;padding:0 12px;border-radius:6px;font-size:10px;background:var(--orange);color:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap}
.btn.ok{background:#1C2452;color:var(--green);border:3px solid var(--cream);box-shadow:none;cursor:default}
.btn.off{background:#3A4372;color:var(--muted);cursor:not-allowed}
.btn.lock{background:transparent;color:var(--muted);border:3px solid var(--muted);box-shadow:none;cursor:default}
.btn.go{background:var(--green);color:var(--ink)}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.needs .card{flex-direction:column;align-items:stretch;min-height:150px;padding:10px}
.needs .card .btn{width:100%;margin-top:auto}

/* inventory */
.grid{display:grid;grid-template-columns:repeat(6,96px);gap:14px}
.slot{position:relative;height:92px;background:#141B42;border:3px solid #3A4372;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px}
.slot .n{position:absolute;right:4px;top:4px;background:var(--ink);color:var(--sun);font:10px var(--px);padding:3px 4px}
.slot.empty{opacity:.5}

/* quests */
.qlist{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:470px;overflow:auto;padding-right:6px}
.q{background:#1C2452;border:3px solid #3A4372;padding:12px;display:flex;flex-direction:column;gap:8px}
.q.done{border-color:var(--green);background:#21462F}
.q.active{border-color:var(--sun)}
.q h5{margin:0;font:11px var(--px);line-height:1.4}
.q p{margin:0;font-size:14px;line-height:1.35;color:var(--muted);font-weight:500}
.q .row{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13px}
.prog{height:12px;background:rgba(255,255,255,.15)}
.prog i{display:block;height:100%;background:var(--sun)}
.quiz h3{font-size:22px;line-height:1.3;margin:6px 0 18px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{min-height:84px;font-family:var(--ui);font-size:19px;font-weight:600;background:#26305E;color:var(--cream);border:3px solid var(--cream);border-radius:14px;padding:10px}
.opt.wrong{background:#5A1E1C;border-color:#FF8A80;text-decoration:line-through;opacity:.7}
.opt.right{background:#2F6B45;border-color:var(--green)}
.fact{margin-top:18px;background:#0F1534;border-left:6px solid var(--sun);padding:14px 16px;font-size:17px;line-height:1.4}

/* guide */
.gcards{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.gc{border:4px solid;padding:16px;background:#141B42;display:flex;flex-direction:column;gap:10px;min-height:400px}
.gc .tag{align-self:flex-start;font:12px var(--px);color:var(--ink);padding:6px 9px}
.gc .art{height:120px;display:grid;place-items:center}
.gc p{margin:0;font-size:15px;line-height:1.35;font-weight:500}
.stat{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:13px}
.stat .mini{grid-column:auto;height:8px}
.drops{display:flex;gap:16px;font-size:11px}
.drops div{display:flex;flex-direction:column;align-items:center;gap:4px}
.dstats{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:22px}
.ds{background:#141B42;border:3px solid #3A4372;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.ds b{font:14px var(--px);color:var(--sun);font-weight:400}

/* intro / end */
#intro{position:absolute;inset:0;z-index:40;background:rgba(7,10,28,.78);display:flex;align-items:center;justify-content:center}
.introBox{width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.introBox h1{margin:0;font:46px var(--px);color:var(--sun);text-shadow:0 6px 0 #8A2420;letter-spacing:2px}
.introBox p{margin:0;font-size:20px;line-height:1.45;max-width:640px;font-weight:500}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}

function parseR(r){return r.split(';').filter(Boolean).map(s=>s.split(',').map(Number))}
function svg(spr,w,h,extra=''){
  const body=parseR(spr.r).map(([x,y,a,b,p])=>`<rect x="${x}" y="${y}" width="${a}" height="${b}" fill="${spr.pal[p]}"/>`).join('');
  return `<svg viewBox="0 0 ${spr.w} ${spr.h}" width="${w}" height="${h}" shape-rendering="crispEdges" aria-hidden="true" ${extra}>${body}</svg>`;
}

function sprCanvas(spr,sc,white){
  const c=document.createElement('canvas');c.width=spr.w*sc;c.height=spr.h*sc;const x=c.getContext('2d');
  for(const [a,b,w,h,p] of parseR(spr.r)){x.fillStyle=white?'#FFFFFF':spr.pal[p];x.fillRect(a*sc,b*sc,w*sc,h*sc)}
  return c;
}

let AC=null;
function beep(f=440,d=.08,type='square',v=.05,slide=0){
  if(!sound)return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();
    o.type=type;o.frequency.value=f;if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,f+slide),AC.currentTime+d);
    g.gain.value=v;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}
}

function rocketSVG(){
  const R=S.rocket, g=(on)=>on?'1':'.22';
  const r=(x,y,w,h,c,o=1)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${c}" opacity="${o}"/>`;
  let s='';
  // scaffold + pad
  for(let y=6;y<42;y+=4){s+=r(0,y,2,1,'#8890A8')+r(0,y+2,2,1,'#5C6480')}
  s+=r(0,6,1,36,'#8890A8')+r(2,12,3,1,'#8890A8')+r(2,26,3,1,'#8890A8');
  s+=r(0,42,16,2,'#5A6390')+r(0,43,16,1,'#2A2F4A');
  // hull + nose
  const hc=g(R.hull);
  s+=r(7,3,2,1,'#C8433C',hc)+r(6,4,4,2,'#C8433C',hc)+r(5,6,6,3,'#E8ECF4',hc);
  s+=r(5,9,6,28,'#E8ECF4',hc)+r(10,9,1,28,'#B9C0D4',hc);
  // nav window
  s+=r(7,12,2,2,'#4FC3F7',g(R.nav))+r(7,12,1,1,'#FFF6E5',g(R.nav));
  // crew pod cross
  const pc=g(R.pod); s+=r(7,16,2,5,'#3FA56A',pc)+r(6,17,4,2,'#3FA56A',pc)+r(7,17,2,2,'#FFF6E5',pc*0+pc);
  // fuel stripes
  const fc=g(R.fuel); s+=r(5,24,6,2,'#E2702F',fc)+r(5,28,6,1,'#FFD84A',fc);
  // engines + fins
  const ec=g(R.engine); s+=r(3,31,2,7,'#C8433C',ec)+r(11,31,2,7,'#C8433C',ec)+r(4,29,1,2,'#C8433C',ec)+r(11,29,1,2,'#C8433C',ec)+r(6,37,4,3,'#6F768E',ec)+r(5,40,6,1,'#5C6480',ec);
  if(rocketFlame) s+=r(6,41,4,3,'#FFD84A')+r(7,44,2,3,'#FF6B57');
  return `<svg viewBox="0 0 16 48" width="80" height="240" shape-rendering="crispEdges" style="display:block;margin-top:-20px;overflow:visible">${s}</svg>`;
}

function upkeep(){const u=S.up,t=S.tog;
  return .8+.1*(u.water+u.food+u.air)+(u.shield>=2?.3:0)+(u.shield>=3?.4:0)+(u.offense>=2&&t.lasers?.4:0)+(u.offense>=3&&t.emp?.3:0)+.25*drillsActive()+.1*Math.max(0,S.res.lifeSupport-1)}
function rates(){
  const fires=W.fires.length, fl=S.dis&&S.dis.kind==='flare';
  return {power:-upkeep()-(fl?12:0),food:-1-.8*fires,water:-1-.8*fires,air:-1,defense:-6-(fl?300:0)};
}
let RATES=rates();
function fmtRate(v){return (v>=0?'+':'')+v.toFixed(1)+'/day'}
const TIER_OUT=[0,2,3,4.5];
function shieldPer(){return Math.round([0,20,30,45][S.up.shield]*mult())}
function pcost(n){return +(n*(S.dis&&S.dis.kind==='flare'?1.5:1)).toFixed(2)}
const ACTS=[
  {id:'pedal',n:'PEDAL',i:'power',show:()=>true,cost:()=>({food:1,water:1,air:1,life:2}),gain:()=>({power:1}),
    tip:'Pedal power: the crew rides bikes that make electricity. It works, but they get hungry, thirsty, out of breath and tired.'},
  {id:'bio',n:'BIOFUEL',i:'biomass',show:()=>S.up.power>=1,cost:()=>({biomass:2}),gain:()=>({power:4}),
    tip:'Burning biofuel makes power, but biomass is also needed for upgrades and rocket fuel.'},
  {id:'solar',n:'SOLAR',i:'power',show:()=>S.up.power>=2,cost:()=>({shield:12}),gain:()=>({power:S.dis&&S.dis.kind==='dust'&&!S.dis.clean?1:3}),
    block:()=>isDay()?'':'Night',tip:'To charge the solar panels we open the dome roof to the sunlight. That makes the shield weaker.'},
  {id:'nuke',n:'NUCLEAR',i:'uranium',show:()=>S.up.power>=3,cost:()=>({uranium:1}),gain:()=>({power:8}),
    tip:'Nuclear power makes lots of energy, but every uranium we burn is one less for the rocket fuel.'},
  {id:'water',n:'WATER',i:'water',show:()=>true,cost:()=>({power:pcost(1)}),gain:()=>({water:TIER_OUT[S.up.water]}),tip:'Cleaning water uses electricity. Better water machines give more water for the same power.'},
  {id:'food',n:'FOOD',i:'food',show:()=>true,cost:()=>({power:pcost(1)}),gain:()=>({food:TIER_OUT[S.up.food]}),tip:'Grow lights and pumps use electricity to grow food.'},
  {id:'air',n:'AIR',i:'air',show:()=>true,cost:()=>({power:pcost(1)}),gain:()=>({air:TIER_OUT[S.up.air]}),tip:'Making oxygen uses electricity.'},
  {id:'shield',n:'SHIELD',i:'defense',show:()=>true,cost:()=>({power:pcost(2)}),gain:()=>({shield:shieldPer()}),tip:'The shield blocks aliens, meteors and radiation, but it fades a little all the time and charging it costs power.'},
  {id:'lasers',n:'LASERS',i:'laser',tog:'lasers',show:()=>S.up.offense>=2,tip:'Lasers use power all the time while ON, and more when they fire.'},
  {id:'emp',n:'EMP',i:'emp',tog:'emp',show:()=>S.up.offense>=3,tip:'While ON, the EMP uses power to stay ready, and 1.5 power for every blast.'},
  {id:'drills',n:'DRILLS',i:'minerals',tog:'drills',show:()=>S.mine.drills>0,tip:'Drills dig minerals and metal, but each drill uses power while ON.'}
];
const ICK={food:'food',water:'water',air:'tank',power:'power',shield:'defense',life:'life',biomass:'biomass',uranium:'uranium'};
function have(k){return k==='shield'?S.shield:k==='life'?S.life:(S.res[k]||0)}
function actBlock(a){
  if(S.dis&&S.dis.kind==='flare'&&S.dis.bunker&&!a.tog)return 'Bunker';
  if(a.block){const b=a.block();if(b)return b}
  if(a.tog)return '';
  if((S.cd[a.id]||0)>S.t)return 'Wait';
  if(isOut('water')&&(a.id==='food'||a.id==='air'))return 'No water';
  for(const [k,v] of Object.entries(a.cost()))if(have(k)<v||(k==='life'&&S.life<=v+5))return 'Need';
  const g=Object.entries(a.gain())[0];
  if(g[0]==='shield'?S.shield>=maxShield()-.5:S.res[g[0]]>=CAP-.05)return 'Full';
  return '';
}
function doAct(id){
  const a=ACTS.find(x=>x.id===id);if(!a||!started||paused||modal||S.over||S.won)return;
  if(a.tog){S.tog[a.tog]=!S.tog[a.tog];sfx.click();say(a.tip,'tog'+a.id);updateActs();return}
  const b=actBlock(a);
  if(b){sfx.wrong();if(b==='Need')say('We do not have enough for that. Every button uses something up!');else if(b==='Night')say('No sunlight at night, so solar charging does not work.');else if(b==='Bunker')say('The crew is hiding in the bunker until the solar flare ends.');return}
  for(const [k,v] of Object.entries(a.cost())){if(k==='shield')S.shield-=v;else if(k==='life')S.life-=v;else S.res[k]-=v}
  for(const [k,v] of Object.entries(a.gain())){if(k==='shield')S.shield=Math.min(maxShield(),S.shield+v);else addRes(k,v)}
  S.cd[a.id]=S.t+.004*(isOut('air')?3:1);sfx.buy();say(a.tip,'act'+a.id);updateActs();updateHUD();
}
let actSig='';
function chipFx(a){
  if(a.tog){const on=S.tog[a.tog];return `<span class="${on?'g':'c'}">${on?'ON':'OFF'}</span>`}
  const c=Object.entries(a.cost()).map(([k,v])=>`<span class="c">-${+v.toFixed(1)}${ic(ICK[k],11)}</span>`).join('');
  const g=Object.entries(a.gain()).map(([k,v])=>`<span class="g">+${+v.toFixed(1)}${ic(ICK[k],11)}</span>`).join('');
  return c+g;
}
function updateActs(){
  const vis=ACTS.filter(a=>a.show()), sig=vis.map(a=>a.id).join();
  const box=$('#acts');
  if(sig!==actSig){actSig=sig;box.innerHTML=vis.map(a=>`<button class="act" data-act="${a.id}"><span class="ai">${ic(ICK[a.i]||a.i,22)}</span><span class="at"><b>${a.n}</b><em></em></span><i class="cd"></i></button>`).join('')}
  for(const a of vis){
    const el=box.querySelector(`[data-act="${a.id}"]`);
    const b=actBlock(a), fxh=chipFx(a)+(b&&b!=='Need'&&b!=='Wait'?`<span style="color:var(--muted)">${b}</span>`:'');
    const em=el.querySelector('em');if(em._h!==fxh){em._h=fxh;em.innerHTML=fxh}
    el.classList.toggle('dis',!!b&&b!=='Wait');
    if(a.tog){el.classList.toggle('on',S.tog[a.tog]);el.classList.toggle('off',!S.tog[a.tog])}
    const cd=Math.min(1,Math.max(0,((S.cd[a.id]||0)-S.t)/.004));el.querySelector('.cd').style.width=(cd*100)+'%';
    el.title=a.tip;
  }
}
$('#acts').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)doAct(b.dataset.act)});

    $('#mb_'+k).style.width=(clamp(vals[k],0,1)*100).toFixed(1)+'%';

    const h=o?'<b>EMPTY</b>':v+rt;const sp=$('#mv_'+k);if(sp._h!==h){sp._h=h;sp.innerHTML=h}

  const left=((day?.5:1)-f)*DAY_SEC; $('#clock').textContent=(day?'Night ':'Sunrise ')+Math.floor(left/60)+':'+String(Math.floor(left%60)).padStart(2,'0');
  $('#dnDay').classList.toggle('on',day);$('#dnNight').classList.toggle('on',!day);
  let st='',alert=false;

  if(S.quest.active&&!alert)st+=' Team is exploring.';
  $('#dayStatus').textContent=st;$('#dayStatus').classList.toggle('alert',alert);
  // pods
  const n=S.res.lifeSupport;$('#podBadge').hidden=n<2;$('#podBadge').textContent='x'+n;

  updateActs();

  dot('bQuest',S.quest.ready?'!':'');
  dot('bMine',S.mine.ore>=5?'!':'');

  // offense panel

  if(showOff){
    const u=S.up, pw=S.res.power>0;

    $('#oLaser').innerHTML=u.offense>=2?orow('laser','Lasers',!S.tog.lasers?'OFF':pw?(W.laserTgt?'FIRING':'READY'):'NO POWER','#FF6B57',pw&&S.tog.lasers?1:0):orow('laser','Lasers','LOCKED','#3A4372',0);
    $('#oEmp').innerHTML=u.offense>=3?orow('emp','EMP',!S.tog.emp?'OFF':W.empCharge>=1?'READY':'CHARGING','#4FC3F7',W.empCharge):orow('emp','EMP','LOCKED','#3A4372',0);
  }
  // punishment panel
  const outs=Object.keys(PEN).filter(k=>started&&isOut(k)), pp=$('#penPanel');
  if(outs.length){pp.style.display='flex';pp.style.top=(showOff?104+$('#offPanel').offsetHeight+10:104)+'px';
    const ph=outs.map(k=>`<div><h4>${PEN[k].n}<span>x${outMult(k).toFixed(1)}</span></h4><ul>${PEN[k].list.map(x=>`<li>${x}</li>`).join('')}</ul></div>`).join('');
    if(pp._h!==ph){pp._h=ph;pp.innerHTML=ph}}
  else pp.style.display='none';
  // banner + event panel
  const parts=[];if(S.dis)parts.push(DISASTER[S.dis.kind].n);

  if(parts.length||W.aliens.length){
    bn.style.display='flex';
    $('#bannerTxt').textContent=parts.length&&W.aliens.length?`${parts[0]} + aliens!`:parts.length?`Warning! ${parts[0]}!`:(W.aliens.some(a=>a.k==='boss')?'Boss alien attack!':'Aliens are attacking!');
  } else bn.style.display='none';
  const ev=$('#evPanel');
  if(S.dis){const D=DISASTER[S.dis.kind];ev.style.display='flex';
    ev.innerHTML=`<h4>${D.n.toUpperCase()}</h4>${D.rows.map(([a,b])=>`<div class="r"><span>${a}</span><b>${b}</b></div>`).join('')}<p>${D.fact}</p>`}
  else ev.style.display='none';

function orow(i,l,s,c,p){return `${svg(ICON[i],24,24)}<div class="st"><span>${l}</span><em style="color:${c}">${s}</em></div><div></div><div class="mini"><i style="width:${clamp(p,0,1)*100}%;background:${c}"></i></div>`}
function dot(id,t){const d=$('#'+id+' .dot');d.textContent=t;d.style.display=t?'flex':'none'}

/* ================= captain ================= */
const capQ=[];let capOn=false,capTimer=0;
function say(txt,key){
  if(key){if(S.tips[key])return;S.tips[key]=1}
  capQ.push(txt);if(!capOn)nextSay();else $('#capMore').textContent='TAP FOR MORE';
}
function nextSay(){
  const c=$('#captain');
  if(!capQ.length){c.style.display='none';capOn=false;return}
  clearTimeout(capTimer);capTimer=setTimeout(nextSay,16000);capOn=true;$('#capTxt').textContent=capQ.shift();$('#capMore').textContent=capQ.length?'TAP FOR MORE':'TAP TO CLOSE';c.style.display='flex';
}
$('#captain').addEventListener('click',()=>{sfx.click();nextSay()});

/* ================= economy & time ================= */
function lsPeriod(){const n=S.res.lifeSupport;return 3/(1+.35*Math.max(0,n-1))}
function addRes(k,n){
  const r=S.res;
  if(['food','water','air','power'].includes(k)){r[k]=Math.min(CAP,r[k]+n)}else r[k]=(r[k]||0)+n;
}
function canPay(c){return Object.entries(c).every(([k,v])=>(S.res[k]||0)>=v)}
function pay(c){for(const [k,v] of Object.entries(c))S.res[k]-=v}
function anyUpgradeAffordable(){
  for(const k in TRACKS){const t=TRACKS[k];const lvl=S.up[k];if(lvl<t.tiers.length&&canPay(t.tiers[lvl].cost))return true}
  return canPay(podCost());
}
function podCost(){const n=S.pods;return {metal:20+10*n,minerals:10+5*n,cells:4+2*n}}

function simulate(gs){
  const dt=gs/DAY_SEC; const before=Math.floor(S.t);
  S.t+=dt;
  if(Math.floor(S.t)>before)newDay(Math.floor(S.t)+1);
  const r=S.res;
  RATES=rates();
  for(const k of ['power','food','water','air'])r[k]=clamp(r[k]+RATES[k]*dt,0,CAP);
  // life support pulse
  if(r.lifeSupport>0){S.lsT+=dt*(r.power>0?1:.5);if(S.lsT>=lsPeriod()){S.lsT=0;const a=1+.5*(r.lifeSupport-1);
    for(const k of ['food','water','air','power'])addRes(k,a);S.life=Math.min(100,S.life+8);
    floatText(310,330,`+${a} life support`,'#6BE08A');sfx.coin();say('Life support made a little food, water, air and power. It refreshes every few days. More pods make it faster!','ls1')}}
  // shield fades all the time (radiation), much faster in a solar flare
  S.shield=clamp(S.shield+RATES.defense*dt,0,maxShield());
  // crew health
  S.out=S.out||{};let dl=0;
  for(const k in PEN){
    if(isOut(k)){const was=S.out[k]||0;S.out[k]=was+dt;if(!was){sfx.alarm();say(PEN[k].say,'pen'+k)}dl-=PEN[k].hurt*outMult(k)}
    else S.out[k]=0;
  }
  if(dl===0&&r.food>.5&&r.water>.5&&r.air>.5)dl=3;
  S.life=clamp(S.life+dl*dt,0,100);
  // warnings
  if(r.power<=1.2&&S.up.power===0)say('Power is almost gone! PEDAL makes a little, but costs supplies. BIOFUEL in UPGRADES is better, if we find biomass.','lowpow');
  if(r.power<=0)say('The power is out! No machines, no lasers, no drills, and the crew is getting cold. Make power any way we can!','nopow');
  for(const k of ['food','water','air'])if(r[k]<=1.5)say(`We are low on ${k}! Press the ${k.toUpperCase()} button. It costs power. Weak aliens drop ${k} too.`,'low'+k);
  if(S.shield<=0)say('Our shield is down, so space radiation is hurting the crew. Press SHIELD to charge it, if we can spare the power.','noshield');
  // mine
  const da=drillsActive();
  if(da>0&&r.power>0){const capOre=12*S.mine.drills;S.mine.ore=Math.min(capOre,S.mine.ore+4*da*dt);S.mine.oreMetal=Math.min(capOre/2,S.mine.oreMetal+1.5*da*dt)}
  // quest
  const qa=S.quest.active;
  if(qa){qa.p+=dt*(isOut('food')?.5:1);if(qa.p>=qa.dur){S.quest.ready=qa.id;S.quest.active=null;sfx.right();say('Our explorers are back with news! Tap QUESTS to see what they found.')}}
  // schedule
  for(const e of S.sched){
    if(e.done)continue;
    if(e.type==='wave'&&!e.warned&&S.t>=e.at-.025){e.warned=true;sfx.alarm();
      say(e.scout?'Alien scouts are coming to look at us! Our blasters will handle them. You can tap them too!':'Our radar sees aliens coming! Get ready!',e.scout?'scout1':null)}
    if(S.t>=e.at){e.done=true;if(e.type==='wave')startWave(e);else startDisaster(e.kind)}
  }
  // disaster timer
  if(S.dis){
    if(S.dis.kind==='fire'){for(const f of W.fires){f.age+=dt}
      S.dis.spread=(S.dis.spread||0)+dt;if(S.dis.spread>.025&&W.fires.length&&W.fires.length<9){S.dis.spread=0;const o=pick(W.fires);W.fires.push({x:clamp(o.x+rnd(-70,70),260,1240),y:o.y,age:0,ph:Math.random()*6})}
      W.fires=W.fires.filter(f=>f.age<DISASTER.fire.dur);if(!W.fires.length)endDisaster()}
    else if(S.t>=S.dis.end&&!(S.dis.kind==='meteor'&&(W.meteors.length||S.dis.left>0)))endDisaster();
  }
  // lose
  if(S.life<=0&&!S.over){S.over=true;gameOver()}
}

function newDay(d){
  S.day=d;
  planDay(d);
  if(d===3)say('Day 3! Alien scouts might visit soon. They are weak, but they drop food, water and air.');
  if(d===6)say('Day 6. The aliens know we are here now. Real waves start today! Tap aliens to zap them. Weak ones drop food, water and air. Medium ones drop metal and power cells. Bosses drop uranium and life support!');
  if(d===8)say('Medium aliens are joining the waves. They are tougher but drop power cells and metal.');
  if(d===10&&!S.tech){S.tech=1;say('Uh oh, the aliens upgraded their tech! They now wear armor and take less damage. Keep upgrading our defenses!')}
  if(d===14&&S.tech<2){S.tech=2;say('The aliens built faster boots! They move quicker now. Lasers and EMP help a lot.')}
  else if(d>1&&d!==3&&d!==6&&d!==8)say('Good morning, day '+d+'! Fun fact: '+FACTS[(d-2)%FACTS.length]);
}
function planDay(d){
  const ev=[], base=d-1;
  if(d>=3&&d<=5&&Math.random()<.65)ev.push({at:base+rnd(.15,.85),type:'wave',comp:{weak:ri(1,2)},scout:true});
  if(d>=6){
    const n=Math.min(3,1+Math.floor((d-6)/4));
    for(let i=0;i<n;i++){
      const night=Math.random()<.6;
      const comp={weak:Math.min(10,1+Math.floor(d/2))};
      if(d>=8)comp.medium=Math.min(5,1+Math.floor((d-8)/2));
      if(d>=12&&Math.random()<.25)comp.boss=1;
      ev.push({at:base+(night?rnd(.56,.94):rnd(.1,.44)),type:'wave',comp});
    }
    if(d===10||(d>10&&(d-10)%4===0))ev[ev.length-1].comp.boss=1;
  }
  if(d>=2&&Math.random()<.35)ev.push({at:base+rnd(.1,.9),type:'disaster',kind:pick(Object.keys(DISASTER))});
  ev.sort((a,b)=>a.at-b.at);
  S.sched=ev;
}

/* ================= combat ================= */
const GROUND=528, DOME_L=430, DOME_R=810, DOME_C=620;
const TUR=[{x:492,y:388},{x:748,y:388}], LASER={x:620,y:332};
function startWave(e){
  let i=0;
  for(const k of ['weak','medium','boss'])for(let j=0;j<(e.comp[k]||0);j++){W.spawn.push({k,delay:i*1.4+rnd(0,.6),side:i%2?1:-1});i++}
}
function spawnAlien(k,side){
  const A=ALIEN[k], d=Math.floor(S.t)+1;
  const hp=Math.round(A.hp*(1+Math.max(0,d-6)*.07));
  const w=SPR[A.spr].w*A.sc,h=SPR[A.spr].h*A.sc;
  W.aliens.push({k,hp,max:hp,w,h,x:side<0?-w:1280+w,y:GROUND+ri(-6,6),side,spd:A.spd*(S.tech>=2?1.2:1),stun:0,flash:0,acc:0,accT:0,ph:Math.random()*6,atk:false});
  if(!S.seen[k]){S.seen[k]=1;
    if(k==='medium')say('A MEDIUM alien! It is armored and strong. Defeat it for power cells and metal.');
    if(k==='boss')say('A BOSS alien is coming! It is huge! Tap it as fast as you can. Bosses drop uranium and life support!');}
}
function hurtAlien(a,amt,show){
  if(a.hp<=0)return;
  amt*=mult()*(S.tech>=1?.85:1);
  a.hp-=amt;a.flash=.08;a.acc+=amt;
  if(show||a.acc>=10){floatText(a.x,a.y-a.h-12,'-'+Math.round(a.acc),'#FF6B57');a.acc=0}
  if(a.hp<=0)killAlien(a);
}
function killAlien(a){
  S.stats.kills++;sfx.kill();
  burst(a.x,a.y-a.h/2,ALIEN[a.k].col,a.k==='boss'?40:16);
  const drops=[];
  if(a.k==='weak'){drops.push([pick(['food','water','air']),1],[pick(['food','water','air']),1]);if(Math.random()<.5)drops.push(['biomass',2])}
  if(a.k==='medium'){drops.push(['cells',ri(1,2)],['metal',ri(2,4)]);if(Math.random()<.4)drops.push(['biomass',3])}
  if(a.k==='boss'){drops.push(['uranium',2],['lifeSupport',1],['metal',5])}
  drops.forEach(([k,n],i)=>W.drops.push({k,n,x:a.x,y:a.y-a.h/2,vx:rnd(-120,120),vy:rnd(-320,-200),t:0,fly:false}));
  if(a.k==='boss')say('We beat the BOSS! It dropped uranium and a life support pod. Uranium is needed for the rocket fuel!','bossdown');
}
function nearest(x,y,range){let b=null,bd=range;for(const a of W.aliens){if(a.hp<=0)continue;const d=Math.hypot(a.x-x,(a.y-a.h/2)-y);if(d<bd){bd=d;b=a}}return b}

function combat(gs){
  // spawn queue
  for(const s of W.spawn)s.delay-=gs;
  for(const s of W.spawn.filter(s=>s.delay<=0))spawnAlien(s.k,s.side);
  W.spawn=W.spawn.filter(s=>s.delay>0);
  const pw=S.res.power>0;
  // aliens
  for(const a of W.aliens){
    a.ph+=gs*6;a.flash=Math.max(0,a.flash-gs);
    if(a.stun>0){a.stun-=gs;continue}
    const stopL=DOME_L-a.w/2+12, stopR=DOME_R+a.w/2-12;
    if(a.side<0&&a.x<stopL){a.x=Math.min(stopL,a.x+a.spd*gs);a.atk=false}
    else if(a.side>0&&a.x>stopR){a.x=Math.max(stopR,a.x-a.spd*gs);a.atk=false}
    else{a.atk=true;const dmg=ALIEN[a.k].dmg*gs;
      if(S.shield>0){S.shield=Math.max(0,S.shield-dmg);W.flash=.15}else{S.life=Math.max(0,S.life-dmg*.35);
        if(Math.random()<gs*.8){const k=pick(['food','water','air','metal','biomass','cells']);if(S.res[k]>=.5){S.res[k]-=.5;floatText(a.x,a.y-a.h-26,'-0.5 '+RES[k].n,'#FF8A80');say('Aliens broke through and are stealing our supplies! Charge the SHIELD to stop them.','steal')}}}
      if(Math.random()<gs*1.2)sfx.hit();
      if(S.life<=0&&!S.over){S.over=true;gameOver()}}
  }
  W.aliens=W.aliens.filter(a=>a.hp>0);
  // blasters
  for(let i=0;i<2;i++){
    W.fireT[i]-=gs;const t=TUR[i];const a=nearest(t.x,t.y,520);t.tgt=a;
    if(a&&W.fireT[i]<=0){W.fireT[i]=.4*(isOut('food')||isOut('power')?2:1);W.shots.push({x:t.x,y:t.y-8,a});sfx.shot()}
  }
  for(const s of W.shots){
    if(!s.a||s.a.hp<=0){s.dead=true;continue}
    const tx=s.a.x,ty=s.a.y-s.a.h/2,dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy),st=760*gs;
    if(d<=st){hurtAlien(s.a,4);s.dead=true}else{s.x+=dx/d*st;s.y+=dy/d*st}
  }
  W.shots=W.shots.filter(s=>!s.dead);
  // laser
  W.laserTgt=null;
  if(S.up.offense>=2&&pw&&S.tog.lasers){const a=nearest(LASER.x,LASER.y,600);if(a){W.laserTgt=a;hurtAlien(a,15*gs);S.res.power=Math.max(0,S.res.power-.012*gs)}}
  // emp
  if(S.up.offense>=3&&pw&&S.tog.emp){
    W.empCharge=Math.min(1,W.empCharge+gs/9);
    if(W.empCharge>=1&&S.res.power>=1.5&&W.aliens.some(a=>Math.abs(a.x-DOME_C)<420)){
      W.empCharge=0;S.res.power-=1.5;sfx.emp();W.rings.push({x:DOME_C,y:470,r:20,max:430});
      for(const a of W.aliens)if(Math.abs(a.x-DOME_C)<430){a.stun=2.5;hurtAlien(a,12,true)}
      say('EMP blast! It freezes alien machines for a moment.','emp1');
    }
  }
  for(const r of W.rings)r.r+=600*gs;W.rings=W.rings.filter(r=>r.r<r.max);
  // meteors
  if(S.dis&&S.dis.kind==='meteor'&&S.dis.left>0){S.dis.nt-=gs;if(S.dis.nt<=0){S.dis.nt=rnd(.8,1.6);S.dis.left--;
    const tx=rnd(440,800),sx=tx+rnd(-500,300);W.meteors.push({x:sx,y:-40,tx,ty:rnd(380,420),spd:rnd(150,200)})}}
  for(const m of W.meteors){const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy),st=m.spd*gs;
    if(d<=st){m.dead=true;burst(m.x,m.y,'#FFB070',14);sfx.hit();
      if(S.shield>0){S.shield=Math.max(0,S.shield-14);W.flash=.2}else S.life=Math.max(0,S.life-12)}
    else{m.x+=dx/d*st;m.y+=dy/d*st}}
  W.meteors=W.meteors.filter(m=>!m.dead);
}

/* ================= disasters ================= */
function startDisaster(kind){
  const D=DISASTER[kind];
  S.dis={kind,end:S.t+D.dur};sfx.alarm();
  if(kind==='dust'){$('#dustTint').style.opacity=.45;
    if(S.up.power>=2)decide('DUST STORM!','Red dust is blowing over the outpost. It covers the solar panels so they barely work.',[
      {l:'Send crew to clean the panels',c:'-1 air, -5 crew health. Solar works normally.',ok:()=>S.res.air>=1,fn:()=>{S.res.air-=1;S.life-=5;S.dis.clean=true}},
      {l:'Wait inside',c:'SOLAR makes only 1 power until the storm ends.',fn:()=>{}}]);
    else decide('DUST STORM!','Red dust is blowing hard. It can leak in through the airlocks.',[
      {l:'Seal the dome',c:'-1.5 power to run the seals.',ok:()=>S.res.power>=1.5,fn:()=>{S.res.power-=1.5}},
      {l:'Leave it open',c:'Dust leaks in: -1 air, -1 water.',fn:()=>{S.res.air=Math.max(0,S.res.air-1);S.res.water=Math.max(0,S.res.water-1)}}]);}
  if(kind==='flare'){$('#flareTint').classList.add('on');
    decide('SOLAR FLARE!','A giant burst of energy from the Sun is hitting Mars! Our power and shield will drain fast until it passes.',[
      {l:'Hide the crew in the bunker',c:'-1 food, -1 water. Crew is safe, but no buttons work until it ends.',ok:()=>S.res.food>=1&&S.res.water>=1,fn:()=>{S.res.food-=1;S.res.water-=1;S.dis.bunker=true}},
      {l:'Keep working',c:'-15 crew health from radiation. Buttons cost 50% more power.',fn:()=>{S.life=Math.max(1,S.life-15)}}]);}
  if(kind==='fire'){
    const spots=[[300,520],[480,528],[760,528],[960,520],[1060,520],[1200,525],[600,530]];
    spots.sort(()=>Math.random()-.5).slice(0,ri(4,5)).forEach(([x,y])=>W.fires.push({x:x+rnd(-15,15),y,age:0,ph:Math.random()*6}));
    say('Fire! Fires burn our food and water. Tap each fire to put it out!','fire1');
  }
  if(kind==='quake'){
    $('#scene').classList.add('shake');setTimeout(()=>$('#scene').classList.remove('shake'),4500);
    S.shield=Math.max(0,S.shield-maxShield()*.25);S.mine.pauseUntil=S.t+.15;
    decide('MARSQUAKE!','The ground is shaking! The shield got hurt and the drill tower is bent.',[
      {l:'Fix it right away',c:'-5 metal. Drills start again.',ok:()=>S.res.metal>=5,fn:()=>{S.res.metal-=5;S.mine.pauseUntil=S.t}},
      {l:'Fix it later',c:'Drills stop for half a day, and the shield loses 10 more.',fn:()=>{S.mine.pauseUntil=S.t+.5;S.shield=Math.max(0,S.shield-10)}}]);
  }
  if(kind==='meteor'){S.dis.left=ri(7,10);S.dis.nt=.5;say('Meteors are falling! Tap them to blast them before they hit. Space rocks have metal inside!','met1')}
}
function endDisaster(){
  if(!S.dis)return;
  if(S.dis.kind==='dust')$('#dustTint').style.opacity=0;
  if(S.dis.kind==='flare'){$('#flareTint').classList.remove('on');if(S.dis.bunker)say('The solar flare is over. The crew can come out of the bunker.')}
  S.dis=null;W.fires=[];
}

/* ================= effects ================= */
function floatText(x,y,t,c){W.texts.push({x,y,t,c,life:1.2})}
function burst(x,y,c,n){for(let i=0;i<n;i++)W.parts.push({x,y,vx:rnd(-160,160),vy:rnd(-220,40),c:Math.random()<.5?c:'#FFD84A',life:rnd(.4,.8),s:ri(3,6)})}
const INV_POS={x:1072,y:671};
function effects(gs,rdt){
  for(const p of W.parts){p.x+=p.vx*gs;p.y+=p.vy*gs;p.vy+=500*gs;p.life-=gs}
  W.parts=W.parts.filter(p=>p.life>0);
  for(const t of W.texts){t.y-=36*rdt;t.life-=rdt}
  W.texts=W.texts.filter(t=>t.life>0);
  for(const d of W.drops){
    d.t+=gs;
    if(!d.fly){d.x+=d.vx*gs;d.y+=d.vy*gs;d.vy+=700*gs;if(d.y>GROUND-6){d.y=GROUND-6;d.vy=0;d.vx*=.5}if(d.t>.9)d.fly=true}
    else{const dx=INV_POS.x-d.x,dy=INV_POS.y-d.y,dist=Math.hypot(dx,dy),st=900*gs;
      if(dist<=st){d.dead=true;addRes(d.k,d.n);sfx.coin();floatText(1072+rnd(-40,40),540,`+${d.n} ${RES[d.k].n}`,'#FFD84A')}
      else{d.x+=dx/dist*st;d.y+=dy/dist*st}}
  }
  W.drops=W.drops.filter(d=>!d.dead);
  // dust particles
  const dusty=S.dis&&S.dis.kind==='dust';
  if(dusty&&W.dust.length<140)for(let i=0;i<6;i++)W.dust.push({x:1300+rnd(0,200),y:rnd(90,620),v:rnd(380,700),l:rnd(10,40)});
  for(const p of W.dust)p.x-=p.v*Math.max(gs,rdt*.3);
  W.dust=W.dust.filter(p=>p.x>-50&&(dusty||Math.random()>.02));
  W.flash=Math.max(0,W.flash-rdt);
}

function render(){
  ctx.clearRect(0,0,1280,720);
  const now=performance.now()/1000;
  // shield bubble
  const l=S.up.shield, ms=maxShield();
  if(S.shield>0&&l>=2){
    ctx.save();ctx.globalAlpha=.10+.08*(S.shield/ms)+W.flash;
    ctx.strokeStyle=l>=3?'#B48CF0':'#4FC3F7';ctx.lineWidth=6;ctx.setLineDash([12,8]);ctx.lineDashOffset=-now*20;
    ctx.beginPath();ctx.ellipse(DOME_C,530,230,215,0,Math.PI,0);ctx.stroke();ctx.restore();
  } else if(W.flash>0){ctx.save();ctx.globalAlpha=W.flash*2;ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.ellipse(DOME_C,530,200,200,0,Math.PI,0);ctx.fill();ctx.restore()}
  // turrets
  for(const t of TUR)drawTurret(t.x,t.y,t.tgt,'#9AA2BC');
  if(S.up.offense>=2)drawTurret(LASER.x,LASER.y,W.laserTgt,'#C8433C');
  // laser beam
  if(W.laserTgt){const a=W.laserTgt;ctx.save();ctx.strokeStyle='rgba(255,59,48,.35)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(LASER.x,LASER.y-10);ctx.lineTo(a.x,a.y-a.h/2);ctx.stroke();
    ctx.strokeStyle='#FF8A80';ctx.lineWidth=3;ctx.stroke();ctx.restore()}
  // fires
  for(const f of W.fires)drawFire(f,now);
  // aliens
  for(const a of W.aliens){
    const img=a.flash>0?IMG[a.k+'W']:IMG[a.k];
    const bob=a.atk?Math.sin(a.ph*2)*4:Math.abs(Math.sin(a.ph))*-4;
    ctx.save();
    if(a.stun>0){ctx.globalAlpha=.75}
    if(a.side>0){ctx.translate(a.x,0);ctx.scale(-1,1);ctx.translate(-a.x,0)}
    ctx.drawImage(img,Math.round(a.x-a.w/2),Math.round(a.y-a.h+bob));
    ctx.restore();
    if(a.stun>0){ctx.strokeStyle='#4FC3F7';ctx.lineWidth=3;ctx.strokeRect(a.x-a.w/2-4,a.y-a.h-4+bob,a.w+8,a.h+8)}
    if(S.tech>=1){ctx.fillStyle='rgba(79,195,247,.85)';ctx.fillRect(a.x-a.w/2,a.y-a.h-22,8,8)}
    // hp bar
    const bw=Math.max(36,a.w*.8);
    ctx.fillStyle='#0B1026';ctx.fillRect(a.x-bw/2-2,a.y-a.h-14,bw+4,8);
    ctx.fillStyle='#3A2026';ctx.fillRect(a.x-bw/2,a.y-a.h-12,bw,4);
    ctx.fillStyle='#FF3B30';ctx.fillRect(a.x-bw/2,a.y-a.h-12,bw*clamp(a.hp/a.max,0,1),4);
  }
  // shots
  ctx.fillStyle='#FFE680';for(const s of W.shots)ctx.fillRect(s.x-3,s.y-3,6,6);
  // emp rings
  for(const r of W.rings){ctx.save();ctx.globalAlpha=1-r.r/r.max;ctx.strokeStyle='#4FC3F7';ctx.lineWidth=8;ctx.beginPath();ctx.arc(r.x,r.y,r.r,0,Math.PI*2);ctx.stroke();ctx.restore()}
  // meteors
  for(const m of W.meteors){
    const ang=Math.atan2(m.ty-m.y,m.tx-m.x);
    for(let i=1;i<6;i++){ctx.fillStyle=i<3?'#FFD84A':'#FF8A3D';ctx.globalAlpha=1-i/6;const s=14-i*2;ctx.fillRect(m.x-Math.cos(ang)*i*10-s/2,m.y-Math.sin(ang)*i*10-s/2,s,s)}
    ctx.globalAlpha=1;ctx.fillStyle='#5C3A1C';ctx.fillRect(m.x-10,m.y-10,20,20);ctx.fillStyle='#8A5A2B';ctx.fillRect(m.x-10,m.y-10,14,14);ctx.fillStyle='#B8803F';ctx.fillRect(m.x-6,m.y-6,4,4);
  }
  // particles
  for(const p of W.parts){ctx.globalAlpha=clamp(p.life*2,0,1);ctx.fillStyle=p.c;ctx.fillRect(p.x,p.y,p.s,p.s)}
  ctx.globalAlpha=1;
  // drops
  for(const d of W.drops){const c=ICANV[RES[d.k].i];ctx.fillStyle='rgba(11,16,38,.55)';ctx.fillRect(d.x-15,d.y-15,30,30);ctx.drawImage(c,Math.round(d.x-12),Math.round(d.y-12))}
  // dust
  if(W.dust.length){ctx.fillStyle='rgba(255,214,165,.55)';for(const p of W.dust)ctx.fillRect(p.x,p.y,p.l,3)}
  // text
  ctx.font='12px "Press Start 2P", monospace';ctx.textAlign='center';
  for(const t of W.texts){ctx.globalAlpha=clamp(t.life*1.5,0,1);ctx.fillStyle='#0B1026';ctx.fillText(t.t,t.x+2,t.y+2);ctx.fillStyle=t.c;ctx.fillText(t.t,t.x,t.y)}
  ctx.globalAlpha=1;
}
function drawTurret(x,y,tgt,col){
  ctx.fillStyle='#5C6480';ctx.fillRect(x-14,y-8,28,10);
  ctx.fillStyle=col;ctx.fillRect(x-10,y-16,20,9);ctx.fillStyle='#E8ECF4';ctx.fillRect(x-8,y-15,6,3);
  let ang=-Math.PI/2;if(tgt)ang=Math.atan2((tgt.y-tgt.h/2)-(y-12),tgt.x-x);
  ctx.save();ctx.translate(x,y-12);ctx.rotate(ang);ctx.fillStyle='#2A2F4A';ctx.fillRect(0,-3,22,6);ctx.restore();
}
function drawFire(f,now){
  const fr=Math.floor((now*8+f.ph))%2, x=Math.round(f.x), y=Math.round(f.y), s=6;
  const rows=fr?[[1,0,1,'#FFD84A'],[0,1,3,'#FF8A3D'],[0,2,3,'#FF8A3D'],[-1,3,5,'#E8432F'],[-1,4,5,'#E8432F'],[0,5,3,'#B8251B']]
               :[[0,0,1,'#FFD84A'],[0,1,2,'#FFD84A'],[-1,2,4,'#FF8A3D'],[-1,3,5,'#FF8A3D'],[-1,4,5,'#E8432F'],[0,5,3,'#B8251B']];
  for(const [dx,dy,w,c] of rows){ctx.fillStyle=c;ctx.fillRect(x+(dx-1)*s,y-(6-dy)*s,w*s,s)}
  ctx.fillStyle='rgba(60,60,70,.5)';ctx.fillRect(x-4+Math.sin(now+f.ph)*6,y-60-((now*30+f.ph*10)%40),12,12);
}

/* ================= input on the scene ================= */
let scale=1;
function toStage(e){const r=$('#stage').getBoundingClientRect();return {x:(e.clientX-r.left)/scale,y:(e.clientY-r.top)/scale}}
let swallowClick=false;
$('#scene').addEventListener('pointerdown',e=>{
  if(!started||paused||modal||S.over||S.won)return;
  const p=toStage(e);
  const zap=need=>{if(S.res.power<need){say('The zapper needs power! No power, no zapping.','nozap');sfx.wrong();return false}S.res.power-=need;return true};
  for(const m of W.meteors){if(Math.hypot(m.x-p.x,m.y-p.y)<34){swallowClick=true;if(!zap(.05))return;m.dead=true;burst(m.x,m.y,'#B8803F',14);sfx.kill();
    W.drops.push({k:'metal',n:1,x:m.x,y:m.y,vx:rnd(-60,60),vy:-200,t:0,fly:false});return}}
  for(const f of W.fires){if(Math.abs(f.x-p.x)<34&&p.y<f.y+10&&p.y>f.y-60){swallowClick=true;if(S.res.water<.2){say('No water left to fight the fire!','nowaterfire');sfx.wrong();return}f.age=99;burst(f.x,f.y-20,'#4FC3F7',12);sfx.coin();S.res.water-=.2;floatText(f.x,f.y-50,'-0.2 water','#4FC3F7');return}}
  for(let i=W.aliens.length-1;i>=0;i--){const a=W.aliens[i];
    if(p.x>a.x-a.w/2-12&&p.x<a.x+a.w/2+12&&p.y>a.y-a.h-16&&p.y<a.y+12){swallowClick=true;if(!zap(.02))return;hurtAlien(a,isOut('food')?4:8,true);burst(p.x,p.y,'#FFF6E5',6);sfx.hit();return}}
},true);
$('#scene').addEventListener('click',e=>{if(swallowClick){swallowClick=false;e.stopPropagation()}},true);
$('#rocket').addEventListener('click',()=>{if(started&&!S.won){sfx.click();openRocket()}});
$('#mine').addEventListener('click',()=>{if(started){sfx.click();openMines()}});
$('#pods').addEventListener('click',()=>{if(started){sfx.click();say(`Life support pods: ${S.res.lifeSupport}. Every ${lsPeriod().toFixed(1)} days they add a little food, water, air and power, and heal the crew. Bosses drop more pods!`)}});

/* ================= panels ================= */
function costHTML(c){
  const e=Object.entries(c);if(!e.length)return '<span>Built</span>';
  return e.map(([k,v])=>`<span class="${(S.res[k]||0)>=v?'':'no'}">${ic(RES[k].i,16)}${v} ${RES[k].n}</span>`).join('');
}
function openModal(html,full,onClose){
  modal={onClose};$('#captain').classList.add('low');const o=$('#overlay');o.innerHTML=html;o.className=full?'':'dim';o.style.display='block';
  o.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>{sfx.click();closeModal()}));
}
function decide(title,text,opts){
  const html=`<div class="modal" style="width:860px"><div class="mhead"><h2>${title}</h2></div>
    <p style="font-size:19px;line-height:1.4;margin:0 0 18px;font-weight:500">${text}</p>
    <div class="opts" style="grid-template-columns:1fr 1fr">${opts.map((o,i)=>{const ok=!o.ok||o.ok();return `<button class="opt" data-d="${i}" ${ok?'':'disabled style="opacity:.45"'}><span style="display:block;margin-bottom:8px">${o.l}</span><span style="font-size:15px;color:#FFB4A8;font-weight:500">${ok?o.c:'Not enough supplies'}</span></button>`}).join('')}</div>
    <p class="hint" style="margin:14px 0 0">There is no perfect choice. Pick what helps most right now.</p></div>`;
  openModal(html);modal.forced=true;
  $('#overlay').querySelectorAll('[data-d]').forEach(b=>b.addEventListener('click',()=>{if(b.disabled)return;sfx.click();closeModal(true);opts[+b.dataset.d].fn();updateHUD()}));
}
function closeModal(force){if(!modal||(modal.forced&&force!==true))return;const m=modal;modal=null;$('#captain').classList.remove('low');$('#overlay').style.display='none';$('#overlay').innerHTML='';m.onClose&&m.onClose();updateHUD()}
$('#overlay').addEventListener('click',e=>{if(e.target.id==='overlay'&&!(modal&&modal.forced)){sfx.click();closeModal()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function resPills(keys){return keys.map(k=>`<div class="pill">${ic(RES[k].i,18)}${RES[k].n} <b>${Math.floor(S.res[k])}</b></div>`).join('')}

/* Upgrades */
function upCard(track,i,needs){
  const T=TRACKS[track], tier=T.tiers[i], lvl=S.up[track];
  const owned=i<lvl, next=i===lvl, afford=next&&canPay(tier.cost);
  const cls=owned?'owned':next?'next':'locked';
  const btn=owned?'<button class="btn ok" tabindex="-1">Owned</button>':next?`<button class="btn ${afford?'':'off'}" data-buy="${track}">${afford?'Build':'Need more'}</button>`:'<button class="btn lock" tabindex="-1">Locked</button>';
  const lv=needs?`<div class="lvl">LEVEL ${i+1}</div>`:'';
  const cost=owned?(i===T.start-1||Object.keys(tier.cost).length===0?'Built':'Built'):costHTML(tier.cost);
  const info=(INFO[track]||INFO.need)[i];
  return `<div class="card ${cls}" data-fact="${track}:${i}"><div class="txt">${lv}<div class="nm">${tier.n.toUpperCase()}</div><div class="cost">${owned?'<span>Working</span>':cost}</div><div class="cost" style="color:#8FD8F0">${info}</div></div>${btn}</div>`;
}
function openUpgrades(){
  const pc=podCost(), pa=canPay(pc);
  const html=`<div class="full">
    <div class="fhead"><h2>Upgrades</h2>${resPills(['metal','cells','uranium','biomass','minerals','steel'])}<button class="back" data-close>Back to outpost</button></div>
    <div class="cols">
      <div class="col"><h3 style="background:#FFD84A">Electricity</h3>
        ${[0,1,2].map(i=>upCard('power',i)).join('')}
        <div class="sub">LIFE SUPPORT</div>
        <div class="card next" data-fact="pod"><div class="txt"><div class="nm">LIFE SUPPORT POD (${S.res.lifeSupport})</div><div class="cost">${costHTML(pc)}</div><div class="cost" style="color:#8FD8F0">Faster refills. Upkeep +0.1 power/day</div></div><button class="btn ${pa?'':'off'}" data-buy="pod">${pa?'Build':'Need more'}</button></div>
        <div class="sub">ROCKET HOME</div>
        <div class="card next" data-rocket="1"><div class="txt"><div class="nm">ROCKET PARTS</div><div class="cost"><span>${PARTS.filter(p=>S.rocket[p.k]).length} of 5 built</span></div></div><button class="btn go" data-rocket="1">Open</button></div>
      </div>
      <div class="col"><h3 style="background:#5FD3C4">Defense</h3>
        <div class="sub" style="margin-top:0">WEAPONS</div>${[0,1,2].map(i=>upCard('offense',i)).join('')}
        <div class="sub">SHIELDS</div>${[0,1,2].map(i=>upCard('shield',i)).join('')}
      </div>
      <div class="col"><h3 style="background:#8DE39A">Basic Needs</h3>
        <div class="needs">

function buy(track){
  if(track==='pod'){const c=podCost();if(!canPay(c)){sfx.wrong();return}pay(c);S.pods++;S.res.lifeSupport++;sfx.buy();say('New life support pod built! Now they work faster together.');openUpgrades();return}
  const T=TRACKS[track],lvl=S.up[track],tier=T.tiers[lvl];
  if(!tier||!canPay(tier.cost)){sfx.wrong();say('We need more supplies for that. Check the red numbers to see what is missing.');return}
  pay(tier.cost);S.up[track]++;sfx.buy();
  if(track==='shield')S.shield=Math.min(maxShield(),S.shield+40);
  say(tier.n+' built! '+tier.fact);
  openUpgrades();
}

/* Mines */

        <button class="btn ${m.ore>=1||m.oreMetal>=1?'go':'off'}" id="collect">Collect (-0.5 power)</button></div>
      <div class="ds"><b>NEW DRILL</b><span>Digs 4 minerals and 1.5 metal a day. Uses 0.25 power a day while ON.</span><div class="card" style="all:unset" ><div class="cost" style="display:flex;gap:8px;font-size:13px">${costHTML(dc)}</div></div>
        <button class="btn ${canDrill?'':'off'}" id="buyDrill">${m.drills>=m.slots?'Mine full':'Add drill'}</button></div>
      <div class="ds"><b>BIGGER MINE</b><span>Room for 2 more drills (${m.slots} of 8 now).</span><div class="cost" style="display:flex;gap:8px;font-size:13px">${m.slots>=8?'Max size':costHTML(ec)}</div>

/* Inventory */

/* Quests */
function openQuests(){
  if(S.quest.ready)return openQuiz(S.quest.ready);
  const d=Math.floor(S.t)+1, qa=S.quest.active;
  const list=QUESTS.map(q=>{
    const done=S.quest.done.includes(q.id), act=qa&&qa.id===q.id, locked=d<q.day;
    const rw=Object.entries(q.rw).map(([k,v])=>`<span style="display:inline-flex;gap:4px;align-items:center">${ic(RES[k].i,16)}${v}</span>`).join(' ');

      <div class="row"><span>${q.h} hours &middot; ${rw} &middot; +5% defense</span>${right}</div>${done?'':`<div class="row" style="color:#FF8A80;justify-content:flex-start;gap:8px">Trip supplies: ${costHTML(qCost(q))}</div>`}</div>`}).join('');
  const html=`<div class="modal" style="width:960px">
    <div class="mhead">${ic('defense',36)}<h2>QUESTS</h2><span class="pill">Defense bonus +${Math.round(S.bonus*100)}%</span><button class="x" data-close aria-label="Close">X</button></div>
    <p class="hint" style="margin:0 0 14px;font-size:16px">Send explorers to learn about Mars and the aliens. Each quest makes our defenses 5% stronger, but the team needs supplies packed for the trip.</p>

  openModal(html);
  $('#overlay').querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{

    say(`The team left for "${q.n}". They will be back in ${q.h} hours.`);closeModal()}));
}
function qCost(q){const n=Math.ceil(q.h/2);return {food:n,water:n,air:n}}
function openQuiz(id){

function launch(){
  closeModal();S.won=true;save();rocketFlame=true;drawRocket();

function fit(){scale=Math.min(innerWidth/1280,innerHeight/720);$('#stage').style.transform=`translate(-50%,-50%) scale(${scale})`}
addEventListener('resize',fit);fit();

function skyUpdate(){
  const f=S.t%1;
  let n; if(f<.45)n=0;else if(f<.55)n=(f-.45)/.1;else if(f<.95)n=1;else n=1-(f-.95)/.05;
  $('#skyNight').style.opacity=n;$('#stars').style.opacity=n;$('#nightTint').style.opacity=started&&isOut('power')?Math.min(.85,n*.55+.4):n*.55;
  const sp=f<.5?f/.5:-1, mp=f>=.5?(f-.5)/.5:-1;
  const sun=$('#sun'),moon=$('#moon');
  const arc=p=>`translate(${170+p*820}px,${330-Math.sin(p*Math.PI)*210}px)`;
  if(sp>=0){sun.style.display='block';sun.style.transform=arc(sp)}else sun.style.display='none';
  if(mp>=0){moon.style.display='block';moon.style.transform=arc(mp)}else moon.style.display='none';
}

let last=performance.now(), hudT=0, saveT=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  const run=started&&!paused&&!modal&&!S.over&&!S.won;
  const gs=run?rdt*S.speed:0;
  if(run){const n=Math.ceil(gs/.05);for(let i=0;i<n;i++){if(!run||modal||S.over||S.won)break;simulate(gs/n);combat(gs/n);effects(gs/n,rdt/n)}}
  else effects(0,rdt);
  render();skyUpdate();
  hudT+=rdt;if(hudT>.15&&started){hudT=0;updateHUD()}
  saveT+=rdt;if(saveT>5&&started&&!S.over&&!S.won){saveT=0;save()}
  requestAnimationFrame(frame);
}
showIntro();drawRocket();updateHUD();
requestAnimationFrame(frame);
window.claude?.hot?.snapshot?.(()=>({}));
</script>
