<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>Mars Outpost</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Press+Start+2P&display=swap">
<style>
/* Layout: one fixed 1280x720 pixel-art stage, scaled to fit the window. HUD on top, action bar on the bottom, panels slide over the scene. */
:root{
  --ink:#0B1026; --ink2:#1A2250; --ink3:#26305E; --line:#3A4372;
  --cream:#FFF6E5; --muted:#A9B1C6; --sun:#FFD84A; --teal:#35CDBB;
  --red:#C8433C; --alarm:#FF3B30; --green:#6BE08A; --orange:#E2702F; --purple:#9F7AEA; --sky:#4FC3F7;
  --px:"Press Start 2P", ui-monospace, monospace;
  --ui:Fredoka, "Trebuchet MS", system-ui, sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--ink);overflow:hidden}
#wrap{position:fixed;inset:0;background:var(--ink)}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;overflow:hidden;transform-origin:center center;
  font-family:var(--ui);font-weight:600;color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:manipulation;
  -webkit-tap-highlight-color:transparent}
button{font-family:var(--px);cursor:pointer;border:none}
button:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
.px{font-family:var(--px);font-weight:400}

/* ---------- scene ---------- */
#scene{position:absolute;inset:0}
#scene.shake{animation:shake .12s linear infinite}
@keyframes shake{0%{transform:translate(0,0)}25%{transform:translate(-6px,3px)}50%{transform:translate(5px,-3px)}75%{transform:translate(-3px,-4px)}100%{transform:translate(0,0)}}
.sky{position:absolute;inset:0}
#skyDay{background:linear-gradient(#FFD6A5,#F6A56E 55%,#E57C42)}
#skyNight{background:linear-gradient(#070A1C,#1A2250 60%,#4A2A4E);opacity:0}
#stars{position:absolute;inset:0 0 200px 0;opacity:0}
#stars i{position:absolute;width:3px;height:3px;background:#FFF6E5}
#sun,#moon{position:absolute;width:110px;height:110px;left:0;top:0}
#sunGlow{position:absolute;left:-20px;top:-20px;width:150px;height:150px;border-radius:50%;
  background:radial-gradient(rgba(255,246,208,.9) 0,rgba(255,211,107,.55) 40%,rgba(255,211,107,0) 70%)}
.hill{position:absolute;border-radius:50%}
#ground{position:absolute;left:0;bottom:0;width:1280px;height:200px;background:linear-gradient(#CB5E2E,#9C3A17)}
.rock{position:absolute;background:#8A3A1B;clip-path:polygon(0 100%,0 60%,20% 60%,20% 30%,60% 30%,60% 0,80% 0,80% 40%,100% 40%,100% 100%)}
.bld{position:absolute;cursor:pointer}
.bld svg{display:block}
#dome{left:430px;bottom:190px;width:380px;height:200px;background:#FFF6E5;
  clip-path:polygon(0 200px,0 140px,20px 140px,20px 90px,40px 90px,40px 60px,60px 60px,60px 40px,80px 40px,80px 30px,100px 30px,100px 20px,120px 20px,120px 10px,140px 10px,140px 0,240px 0,240px 10px,260px 10px,260px 20px,280px 20px,280px 30px,300px 30px,300px 40px,320px 40px,320px 60px,340px 60px,340px 90px,360px 90px,360px 140px,380px 140px,380px 200px);cursor:default}
#domeGlass{position:absolute;inset:10px 10px 0;background:linear-gradient(#C8F0FC,#78C8E2);
  clip-path:polygon(0 190px,0 130px,20px 130px,20px 80px,40px 80px,40px 60px,60px 60px,60px 40px,80px 40px,80px 30px,100px 30px,100px 10px,140px 10px,140px 0,220px 0,220px 10px,260px 10px,260px 30px,280px 30px,280px 40px,300px 40px,300px 60px,320px 60px,320px 80px,340px 80px,340px 130px,360px 130px,360px 190px)}
.shine{position:absolute;height:8px;background:rgba(255,255,255,.5)}
.crew{position:absolute;bottom:0;width:18px;height:50px;animation:walk 6s ease-in-out infinite;--hair:#3A2416}
.crew b{display:block;position:relative;width:18px;height:18px;background:linear-gradient(var(--hair) 0 5px,#F5CDA6 5px);box-shadow:inset -4px 0 0 rgba(0,0,0,.14);border-radius:3px 3px 2px 2px}
.crew b::before{content:"";position:absolute;left:3px;top:7px;width:3px;height:4px;background:#0B1026;box-shadow:9px 0 0 #0B1026,1px 1px 0 -1px #fff}
.crew b::after{content:"";position:absolute;left:5px;top:13px;width:8px;height:2px;background:#B5503C;border-radius:0 0 3px 3px;box-shadow:-3px -1px 0 -1px #F0A58C,11px -1px 0 -1px #F0A58C}
.crew u{display:block;position:relative;width:18px;height:32px;background:#35CDBB;box-shadow:inset -4px 0 0 rgba(0,0,0,.2)}
.crew u::before,.crew u::after{content:"";position:absolute;top:2px;width:5px;height:20px;background:linear-gradient(#2AAE9E 0 16px,#F5CDA6 16px);transform-origin:50% 2px;animation:arm 1.6s ease-in-out infinite}
.crew u::before{left:-6px}
.crew u::after{right:-6px;animation-delay:-.8s}
@keyframes arm{0%,100%{transform:rotate(18deg)}50%{transform:rotate(-18deg)}}
/* crew crouch (disasters) and panic (alien attacks) */
#dome.crouch .crew{height:36px;animation:shiver .22s linear infinite}
#dome.crouch .crew u{height:18px}
#dome.crouch .crew u::before,#dome.crouch .crew u::after{animation:none;transform:rotate(165deg);height:16px}
@keyframes shiver{0%,100%{transform:translateX(0)}50%{transform:translateX(1.5px)}}
#dome.panic .crew{animation:panicRun 1s ease-in-out infinite}
#dome.panic .crew u::before,#dome.panic .crew u::after{animation:flail .16s ease-in-out infinite alternate}
#dome.panic .crew u::after{animation-delay:-.08s}
#dome.panic .crew b::after{left:6px;top:11px;width:6px;height:5px;border-radius:50%;background:#5A1E1C;box-shadow:none}
#dome.panic .crew::before{content:"!";position:absolute;left:4px;top:-22px;font:13px var(--px);color:#FF3B30;text-shadow:0 2px 0 #0B1026;animation:bob2 .35s ease-in-out infinite}
@keyframes panicRun{0%{transform:translateX(-28px)}22%{transform:translate(-4px,-7px)}45%{transform:translateX(28px)}50%{transform:translateX(28px) scaleX(-1)}72%{transform:translate(4px,-7px) scaleX(-1)}95%{transform:translateX(-28px) scaleX(-1)}100%{transform:translateX(-28px)}}
@keyframes flail{from{transform:rotate(135deg)}to{transform:rotate(215deg)}}
@keyframes walk{0%,100%{transform:translateX(0)}50%{transform:translateX(26px)}}
#domeHouse{position:absolute;left:119px;bottom:0;width:130px;height:72px;background:#A9B1C6;box-shadow:inset 0 -8px 0 #7E87A0;
  clip-path:polygon(0 100%,0 22%,8% 22%,8% 0,92% 0,92% 22%,100% 22%,100% 100%)}
#domeHouse i{position:absolute;top:30px;width:28px;height:22px;background:#FFD84A;box-shadow:inset -4px -4px 0 #E0A800}
#pipe{position:absolute;left:384px;bottom:222px;width:56px;height:14px;background:#8890A8;box-shadow:inset 0 -4px 0 #5C6480,inset 0 4px 0 #B9C0D4}
#pods{left:300px;bottom:190px;width:84px;height:72px}
#podBadge{position:absolute;right:-6px;top:-8px;font:11px var(--px);background:var(--ink);color:var(--green);padding:5px 6px;border:2px solid var(--green)}
#podBar{position:absolute;left:8px;right:8px;bottom:-14px;height:6px;background:rgba(11,16,38,.6)}
#podBar i{display:block;height:100%;width:0;background:var(--green)}
#solar{position:absolute;left:303px;bottom:238px;width:48px;height:30px;display:none}
#mine{left:900px;bottom:190px;width:140px;height:100px}
#rocket{left:30px;bottom:190px;width:80px;height:220px}
#rocket.launch{transition:transform 4s cubic-bezier(.5,0,.9,.4);transform:translateY(-900px)}
.bubble{position:absolute;left:50%;top:-34px;transform:translateX(-50%);background:var(--cream);color:var(--ink);font:10px var(--px);
  padding:6px 8px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.3);animation:bob 1s ease-in-out infinite;pointer-events:none}
.bubble:after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-bottom:0;border-top-color:var(--cream)}
@keyframes bob{50%{transform:translate(-50%,-4px)}}
#nightTint{position:absolute;inset:0;background:#141846;opacity:0;pointer-events:none;mix-blend-mode:multiply}
#dustTint{position:absolute;inset:0;background:#C77A3A;opacity:0;pointer-events:none;transition:opacity 2s}
#fx{position:absolute;inset:0;pointer-events:none}
#flareTint{position:absolute;inset:0;background:radial-gradient(circle at 20% 10%,#FFFBE0,#FFD84A 40%,rgba(255,138,61,.4));opacity:0;pointer-events:none;mix-blend-mode:screen}
#flareTint.on,#flareTint.ips{animation:flare 1.4s ease-in-out infinite}
#flareTint.ips{background:radial-gradient(circle at 20% 10%,#F3E8FF,#B48CF0 40%,rgba(79,195,247,.45))}
@keyframes flare{0%,100%{opacity:.25}50%{opacity:.5}}
#acts{position:absolute;left:24px;right:24px;bottom:104px;height:58px;display:flex;gap:8px;justify-content:center;z-index:5}
.act{flex:1;max-width:132px;min-width:0;display:flex;gap:6px;align-items:center;padding:4px 7px;background:rgba(11,16,38,.92);border:3px solid #3A4372;border-radius:10px;
  color:var(--cream);text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.35);position:relative;overflow:hidden}
.act:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.act .ai{flex:none}
.act *{pointer-events:none}
.act .at{display:flex;flex-direction:column;gap:3px;min-width:0}
.act b{font:8px var(--px);font-weight:400;white-space:nowrap}
.act em{font:600 11px var(--ui);font-style:normal;display:flex;flex-wrap:wrap;gap:0 5px;line-height:1.2}
.act em .c{color:#FF8A80;display:inline-flex;align-items:center;gap:1px}
.act em .g{color:#8DEB9E;display:inline-flex;align-items:center;gap:1px}
.act.dis{opacity:.45;cursor:not-allowed}
.act.on{border-color:var(--green)}
.act.off{border-color:#5A1E1C}
.act .cd{position:absolute;left:0;bottom:0;height:3px;background:var(--sun)}
.meter .lab span i{font-style:normal;color:#FF8A80;margin-left:4px}

/* ---------- HUD ---------- */
#hud{position:absolute;left:0;top:0;right:0;height:84px;background:linear-gradient(#0B1026,#1A2250);border-radius:0 0 26px 26px;
  box-shadow:0 8px 24px rgba(0,0,0,.35);display:flex;gap:22px;align-items:center;padding:0 28px;box-sizing:border-box;z-index:5}
.meter{flex:1;display:flex;flex-direction:column;gap:9px;min-width:0}
.meter .lab{display:flex;align-items:center;gap:8px;font:11px var(--px)}
.meter .lab span{margin-left:auto;color:var(--muted);font-size:10px}
.meter .bar{height:16px;background:rgba(255,255,255,.16);box-shadow:0 0 0 3px rgba(255,255,255,.35)}
.meter .bar i{display:block;height:100%;width:50%;transition:width .3s}
.meter.low .bar{animation:lowpulse .8s steps(2) infinite}
@keyframes lowpulse{50%{box-shadow:0 0 0 3px var(--alarm)}}

#dayPanel{position:absolute;right:24px;top:104px;width:270px;background:rgba(11,16,38,.9);border-radius:22px;padding:16px;box-sizing:border-box;
  display:flex;flex-direction:column;gap:11px;box-shadow:0 8px 20px rgba(0,0,0,.3);z-index:4}
#dayTitle{display:flex;align-items:baseline;justify-content:space-between;font:18px var(--px);white-space:nowrap}
#dayTitle small{font:10px var(--px);color:var(--muted)}
.dn{display:flex;height:30px;border-radius:999px;overflow:hidden}
.dn div{flex:1;display:flex;align-items:center;justify-content:center;font-size:15px;background:#26305E;color:var(--cream)}
.dn div.on{background:var(--sun);color:var(--ink)}
#dayStatus{font-size:15px;line-height:1.35;min-height:21px}
#dayStatus.alert{color:#FF8A80}
.ctrls{display:flex;gap:6px}
.ctrls button{flex:1;height:30px;border-radius:10px;background:#26305E;color:var(--cream);font-size:9px;padding:0 4px;white-space:nowrap}
.ctrls button.on{background:var(--teal);color:var(--ink)}
#cPause{display:flex;align-items:center;justify-content:center;gap:7px;background:var(--sun);color:var(--ink);height:34px;font-size:10px}
#cPause .pic{width:10px;height:12px;border-left:4px solid var(--ink);border-right:4px solid var(--ink);box-sizing:border-box}
#cPause.on{background:var(--green);color:var(--ink)}
#cPause.on .pic{width:0;height:0;border:none;border-left:11px solid var(--ink);border-top:7px solid transparent;border-bottom:7px solid transparent}
#cSpd{height:34px}
#pausedTag{position:absolute;left:50%;top:250px;transform:translateX(-50%);display:none;flex-direction:column;align-items:center;gap:8px;z-index:6;pointer-events:none;
  font:34px var(--px);color:var(--sun);text-shadow:0 5px 0 #0B1026;background:rgba(11,16,38,.7);padding:18px 30px;border:3px solid var(--sun);border-radius:16px}
#pausedTag small{font:600 15px var(--ui);color:var(--cream);text-shadow:none}
#stage.paused #pausedTag{display:flex}

#offPanel{position:absolute;left:24px;top:104px;width:150px;background:rgba(11,16,38,.9);border:2px solid #FF8A80;border-radius:8px;padding:4px 6px;box-sizing:border-box;
  display:none;flex-direction:column;gap:3px;z-index:4}
#offPanel h4{margin:0;font:7px var(--px);color:#FF8A80}
.orow{display:grid;grid-template-columns:11px 1fr auto;gap:1px 4px;align-items:center;font-size:10px;line-height:1.1}
.orow:empty{display:none}
.orow .st{display:flex;justify-content:space-between}
.orow .st em{font-style:normal;font-size:8px;font-weight:700}
#offPanel .mini{height:3px}
.otog{grid-row:1/3;grid-column:3;font:700 9px var(--px,monospace);padding:4px 5px;border-radius:5px;border:2px solid #0B1026;cursor:pointer;color:#0B1026;background:#6BE08A;min-width:34px}
.otog.off{background:#5C6480;color:#E3DCCB}
.mini{height:6px;background:rgba(255,255,255,.15);grid-column:2}
.mini i{display:block;height:100%}

#banner{position:absolute;left:50%;top:104px;transform:translateX(-50%);width:600px;height:52px;display:none;align-items:center;justify-content:center;
  background:repeating-linear-gradient(-45deg,#FFD84A 0 14px,#0B1026 14px 28px);padding:5px;box-sizing:border-box;border-radius:14px;z-index:4}
#banner div{width:100%;height:100%;background:#7A1E1A;border-radius:10px;display:flex;align-items:center;justify-content:center;font:15px var(--px);color:var(--cream);text-align:center}
#penPanel{position:absolute;left:24px;top:104px;width:270px;background:rgba(60,10,12,.94);border:3px solid var(--alarm);padding:10px 12px;box-sizing:border-box;display:none;flex-direction:column;gap:8px;z-index:4;box-shadow:0 0 0 3px var(--ink)}
#penPanel h4{margin:0;font:10px var(--px);color:#FFD0C8;display:flex;justify-content:space-between;gap:6px}
#penPanel h4 span{color:var(--sun)}
#penPanel ul{margin:0;padding-left:16px;font-size:13px;line-height:1.3;font-weight:500;color:#FFE8E2}
.meter.out .bar{background:repeating-linear-gradient(-45deg,rgba(255,59,48,.55) 0 6px,rgba(11,16,38,.6) 6px 12px);animation:lowpulse .5s steps(2) infinite}
.meter .lab span b{color:var(--alarm);font-weight:400}
#evPanel{position:absolute;right:24px;top:346px;width:270px;background:rgba(11,16,38,.92);border:3px solid var(--cream);padding:12px 14px;box-sizing:border-box;display:none;flex-direction:column;gap:7px;z-index:4}
#evPanel h4{margin:0;font:11px var(--px);color:var(--sun)}
#evPanel .r{display:flex;justify-content:space-between;font-size:13px}
#evPanel .r b{color:#FF8A80;font-weight:600}
#evPanel p{margin:4px 0 0;font-size:13px;line-height:1.35;color:var(--muted);font-weight:500}

#nav{position:absolute;left:0;right:0;bottom:0;height:98px;background:linear-gradient(#1A2250,#0B1026);border-radius:26px 26px 0 0;box-shadow:0 -8px 24px rgba(0,0,0,.3);
  display:flex;gap:20px;justify-content:center;align-items:center;z-index:5}
.nb{position:relative;width:196px;height:60px;font-size:13px;border-radius:20px;box-shadow:0 6px 0 rgba(0,0,0,.35);color:var(--ink);transition:transform .08s}
.nb:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.35)}
.nb .dot{position:absolute;right:-6px;top:-8px;min-width:22px;height:22px;border-radius:11px;background:var(--alarm);color:#fff;font:10px var(--px);display:none;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px var(--ink);animation:bob2 1s ease-in-out infinite}
@keyframes bob2{50%{transform:translateY(-4px)}}
#bUp{background:linear-gradient(#5FE0D0,#25A99A)} #bMine{background:linear-gradient(#FFA562,#E2702F)} #bQuest{background:linear-gradient(#8DEB9E,#4DBE67)}
#bDef{background:linear-gradient(#C8433C,#8A2420);color:var(--cream)} #bInv{background:linear-gradient(#FFE680,#E0B020)}

/* Intro movie */
#movie{position:absolute;inset:0;z-index:50;background:#000;cursor:pointer}
#mv{position:absolute;inset:0}
#mvCap{position:absolute;left:110px;right:110px;bottom:30px;background:rgba(11,16,38,.94);border:4px solid var(--cream);box-shadow:0 0 0 4px var(--ink),0 10px 0 rgba(0,0,0,.4);padding:14px 22px;font-size:22px;line-height:1.4;color:var(--cream);min-height:80px}
#mvCap b{display:block;font:11px var(--px);color:var(--sun);margin-bottom:8px}
#mvCap small{position:absolute;right:14px;bottom:8px;font:9px var(--px);color:var(--muted)}
#mvSkip{position:absolute;right:24px;top:20px;height:44px;padding:0 16px;border-radius:12px;background:var(--cream);color:var(--ink);font-size:11px;box-shadow:0 4px 0 rgba(0,0,0,.4)}
#mvDots{position:absolute;left:24px;top:36px;display:flex;gap:6px}
#mvDots i{width:30px;height:8px;background:rgba(255,255,255,.25)}
#mvDots i.on{background:var(--sun)}
.howrow{display:grid;grid-template-columns:34px 130px 1fr;gap:10px;align-items:center;padding:7px 10px;background:#141B42;border:2px solid #3A4372;font-size:15px;font-weight:500}
.howrow b{font-weight:600}
/* Guided tutorial */
#tut{position:absolute;left:50%;top:150px;transform:translateX(-50%);width:600px;display:none;gap:12px;align-items:flex-start;z-index:31}
#tut .face{flex:none;width:72px;height:72px;background:var(--ink);border:3px solid var(--cream);display:grid;place-items:center}
#tut .say{flex:1;background:var(--cream);color:var(--ink);border-radius:16px;padding:14px 16px;font-size:18px;line-height:1.4;box-shadow:0 5px 0 rgba(0,0,0,.3)}
#tut .say b{display:block;font:10px var(--px);color:var(--red);margin-bottom:8px}
#tut .tb{display:flex;gap:8px;margin-top:12px}
#tut .tb button{height:38px;padding:0 12px;border-radius:10px;font-size:10px;background:#E3DCCB;color:var(--ink)}
#tut .tb .nx{margin-left:auto;background:var(--green)}
.spot{outline:5px solid var(--sun)!important;outline-offset:5px;animation:spot 1s ease-in-out infinite}
@keyframes spot{50%{outline-color:rgba(255,216,74,.2)}}
.hear{background:#26305E;color:var(--cream);font-size:10px;height:34px;padding:0 12px;border-radius:10px}
.codebox{font:28px var(--px);color:var(--sun);letter-spacing:3px;background:var(--ink);border:3px dashed var(--sun);padding:14px 18px;text-align:center}
input.code{font:16px var(--px);text-transform:uppercase;width:230px;height:46px;padding:0 12px;border-radius:10px;border:3px solid var(--line);background:var(--ink);color:var(--cream);user-select:text;-webkit-user-select:text}
input.code:focus{outline:3px solid var(--sun);outline-offset:2px}
.mission{background:#1A2250;border:3px solid var(--sun);border-radius:16px;padding:12px 18px;font-size:18px;line-height:1.4;max-width:720px}
.mission b{color:var(--sun)}
/* Quick notices that fade on their own */
#toasts{position:absolute;left:50%;bottom:176px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:35;pointer-events:none;width:700px}
.toast{background:rgba(11,16,38,.95);border:3px solid var(--sun);color:var(--cream);font-size:16px;line-height:1.3;padding:8px 14px;border-radius:12px;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.35);animation:tin .2s ease-out}
.toast.out{opacity:0;transition:opacity .5s}
#overlay[style*="block"]~#toasts{bottom:auto;top:14px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
/* Captain */
#captain{position:absolute;left:24px;top:104px;width:300px;display:none;flex-direction:column;z-index:30;cursor:pointer;background:rgba(11,16,38,.95);
  border:3px solid var(--teal);border-radius:14px;box-shadow:0 6px 0 rgba(0,0,0,.35);overflow:hidden;box-sizing:border-box}
#captain.low{top:auto!important;bottom:16px}
#captain.low.idle{display:none!important}
#captain .chead{display:flex;align-items:center;gap:8px;padding:7px 10px;background:#0E3A40;font:8px var(--px);color:var(--teal);letter-spacing:1px}
#captain .chead span{margin-left:auto;color:var(--sun)}
#captain .led{width:9px;height:9px;border-radius:50%;background:var(--green);animation:led .8s steps(2) infinite}
@keyframes led{50%{opacity:.25}}
#captain.idle{border-color:#3A4372;cursor:default}
#captain.idle .chead{background:#141B42;color:var(--muted)}
#captain.idle .led{background:#3A4372;animation:none}
#captain .cbody{display:flex;gap:10px;padding:10px 12px 6px;align-items:flex-start}
#captain .face{flex:none;width:48px;height:48px;background:var(--ink);border:2px solid var(--cream);display:grid;place-items:center}
#captain .say{flex:1;font-size:17px;line-height:1.3;color:var(--cream);font-weight:600;min-height:44px;display:flex;align-items:center}
#captain .cfoot{display:flex;align-items:center;gap:8px;padding:2px 12px 10px}
#captain .cfoot .hear{height:26px;font-size:8px;padding:0 9px}
#captain .cfoot small{margin-left:auto;font:8px var(--px);color:var(--sun)}
#captain.idle .cbody,#captain.idle .cfoot{display:none}
#captain.ping{animation:ping .5s ease-out}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(53,205,187,.9),0 6px 0 rgba(0,0,0,.35)}100%{box-shadow:0 0 0 14px rgba(53,205,187,0),0 6px 0 rgba(0,0,0,.35)}}

/* ---------- overlay panels ---------- */
#overlay{position:absolute;inset:0;display:none;z-index:20}
#overlay.dim{background:rgba(5,8,22,.55)}
.modal{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#1A2250;border:4px solid var(--cream);box-shadow:0 0 0 4px var(--ink),0 16px 0 rgba(0,0,0,.35);
  padding:22px 24px;box-sizing:border-box;color:var(--cream)}
.mhead{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.mhead h2{margin:0;font:18px var(--px);flex:1}
.x{width:40px;height:40px;background:var(--red);color:var(--cream);font-size:14px;box-shadow:0 0 0 3px var(--cream)}
.full{position:absolute;inset:0;background:linear-gradient(#0B1026,#1A2250);padding:22px 30px;box-sizing:border-box}
.fhead{display:flex;align-items:center;gap:14px;margin-bottom:20px}
.fhead h2{margin:0;font:22px var(--px);margin-right:20px}
.pill{display:flex;align-items:center;gap:6px;background:#26305E;border-radius:999px;padding:5px 12px 5px 8px;font-size:14px}
.back{margin-left:auto;background:var(--cream);color:var(--ink);font-size:11px;height:44px;padding:0 18px;border-radius:12px;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hint{font-size:14px;color:var(--muted);font-weight:500}
.guide{background:#141B42;border:3px solid var(--sun);padding:10px 14px;margin:0 0 14px;font-size:15px;font-weight:500;line-height:1.35}
.guide b{font-weight:600}.guide .step{display:inline-block;background:var(--sun);color:var(--ink);font:11px var(--px);padding:4px 7px;margin-right:6px}
.colnote{font-size:12px;color:var(--muted);font-weight:500;margin:-6px 0 10px;line-height:1.3}
.cost em{font-style:normal;color:var(--muted)}

.cols{display:grid;grid-template-columns:300px 300px 1fr;gap:26px;height:600px}
.cols>.col{overflow-y:auto;min-height:0;padding-right:4px;scrollbar-width:thin}
.cols .card{padding:8px 10px;margin-bottom:8px}
.col h3{margin:0 0 12px;height:42px;display:flex;align-items:center;justify-content:center;font:13px var(--px);color:var(--ink);border:3px solid var(--cream)}
.sub{font:10px var(--px);color:var(--muted);margin:10px 0 8px}
.card{position:relative;display:flex;align-items:center;gap:10px;padding:10px 12px;margin-bottom:10px;background:#1C2452;border:3px solid #3A4372;cursor:pointer;min-height:58px;box-sizing:border-box}
.card .nm{font-size:14px;line-height:1.2}
.card .cost{font-size:12px;color:var(--muted);margin-top:4px;display:flex;flex-wrap:wrap;gap:3px 9px;align-items:center}
.card .cost span{display:inline-flex;align-items:center;gap:3px}
.card .cost .no{color:#FF8A80}
.card .txt{flex:1;min-width:0}
.card.owned{background:#2F6B45;border-color:#6BE08A}
.card.next{border-color:var(--sun)}
.card.locked{opacity:.55}
.lvl{font:9px var(--px);color:var(--sun);margin-bottom:5px}
.btn{height:36px;padding:0 12px;border-radius:6px;font-size:10px;background:var(--orange);color:var(--cream);box-shadow:0 3px 0 rgba(0,0,0,.35);white-space:nowrap}
.btn.ok{background:#1C2452;color:var(--green);border:3px solid var(--cream);box-shadow:none;cursor:default}
.btn.off{background:#3A4372;color:var(--muted);cursor:not-allowed}
.btn.lock{background:transparent;color:var(--muted);border:3px solid var(--muted);box-shadow:none;cursor:default}
.btn.go{background:var(--green);color:var(--ink)}
.needs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.needs .card{flex-direction:column;align-items:stretch;min-height:150px;padding:10px}
.needs .card .btn{width:100%;margin-top:auto}

/* upgrade skill trees */
.utabs{display:flex;gap:6px;margin:-6px 0 0}
.utab{position:relative;display:flex;align-items:center;gap:7px;height:46px;padding:0 13px;border-radius:12px 12px 0 0;background:#141B42;border:3px solid #3A4372;border-bottom:none;color:var(--muted);font-size:10px}
.utab.on{background:#1C2452;border-color:var(--tc);color:var(--cream);box-shadow:inset 0 4px 0 var(--tc)}
.utab .pd{position:absolute;right:-6px;top:-8px;width:20px;height:20px;border-radius:10px;background:var(--green);color:var(--ink);font:10px var(--px);font-style:normal;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--ink)}
.upane{display:grid;grid-template-columns:1fr 360px;gap:16px;height:534px;border-top:3px solid var(--tc);padding-top:14px}
.tree{position:relative;background:radial-gradient(circle at 30% 20%,#1C2452,#0B1026 70%);border:3px solid #3A4372;overflow:auto;background-image:radial-gradient(rgba(255,255,255,.06) 1px,transparent 1px),radial-gradient(circle at 30% 20%,#1C2452,#0B1026 70%);background-size:22px 22px,auto}
.tnote{padding:10px 14px 0;font-size:14px;font-weight:500;color:var(--muted);line-height:1.3}
.tcan{position:relative;width:800px;height:420px}
.tlines{position:absolute;left:0;top:0;pointer-events:none}
.tn{position:absolute;width:136px;height:104px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;background:#1C2452;border:4px solid #3A4372;border-radius:16px;color:var(--cream);
  font:600 13px var(--ui);line-height:1.15;text-align:center;padding:6px;box-sizing:border-box;box-shadow:0 5px 0 rgba(0,0,0,.4);transition:transform .1s}
.tn:hover{transform:translateY(-2px)}
.tn small{font:8px var(--px);color:var(--muted)}
.tn.owned{background:#21462F;border-color:var(--green)}.tn.owned small{color:var(--green)}
.tn.next{border-color:var(--sun)}.tn.next small{color:var(--sun)}
.tn.can{animation:tglow 1.2s ease-in-out infinite}
@keyframes tglow{50%{box-shadow:0 5px 0 rgba(0,0,0,.4),0 0 18px 4px rgba(255,216,74,.55)}}
.tn.locked{opacity:.5;filter:grayscale(.6)}
.tn.sel{outline:4px solid #fff;outline-offset:4px}
.udet{background:#141B42;border:3px solid #3A4372;padding:16px;display:flex;flex-direction:column;gap:10px;overflow:auto}
/* inventory */
.grid{display:grid;grid-template-columns:repeat(6,96px);gap:14px}
.slot{position:relative;height:92px;background:#141B42;border:3px solid #3A4372;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;font-size:12px}
.slot .n{position:absolute;right:4px;top:4px;background:var(--ink);color:var(--sun);font:10px var(--px);padding:3px 4px}
.slot.empty{opacity:.5}
.slot[data-k]{cursor:pointer}.slot[data-k]:hover,.slot.sel{border-color:var(--sun)}
#invInfo{margin-top:12px;min-height:96px;font-size:13px;color:var(--muted)}#invInfo b{color:var(--cream);font-size:16px}#invInfo div{margin-top:4px}

/* quests */
.qlist{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-height:470px;overflow:auto;padding-right:6px}
.q{background:#1C2452;border:3px solid #3A4372;padding:12px;display:flex;flex-direction:column;gap:8px}
.q.done{border-color:var(--green);background:#21462F}
.q.active{border-color:var(--sun)}
.q h5{margin:0;font:11px var(--px);line-height:1.4}
.q p{margin:0;font-size:14px;line-height:1.35;color:var(--muted);font-weight:500}
.q .row{display:flex;align-items:center;gap:10px;justify-content:space-between;font-size:13px}
.prog{height:12px;background:rgba(255,255,255,.15)}
.prog i{display:block;height:100%;background:var(--sun)}
.quiz h3{font-size:22px;line-height:1.3;margin:6px 0 18px}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.opt{min-height:84px;font-family:var(--ui);font-size:19px;font-weight:600;background:#26305E;color:var(--cream);border:3px solid var(--cream);border-radius:14px;padding:10px}
.opt.wrong{background:#5A1E1C;border-color:#FF8A80;text-decoration:line-through;opacity:.7}
.opt.right{background:#2F6B45;border-color:var(--green)}
.fact{margin-top:18px;background:#0F1534;border-left:6px solid var(--sun);padding:14px 16px;font-size:17px;line-height:1.4}

/* guide */
.gcards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;max-height:245px;overflow-y:auto;padding:0 6px 6px 0;scrollbar-width:thin}
.gc{border:4px solid;padding:12px;background:#141B42;display:flex;flex-direction:column;gap:8px}
.gc .tag{align-self:flex-start;font:12px var(--px);color:var(--ink);padding:6px 9px}
.gc .art{height:96px;display:grid;place-items:center}
.gc p{margin:0;font-size:13px;line-height:1.3;font-weight:500}
.stat{display:grid;grid-template-columns:62px 1fr;align-items:center;gap:8px;font-size:13px}
.stat .mini{grid-column:auto;height:8px}
.drops{display:flex;gap:16px;font-size:11px}
.drops div{display:flex;flex-direction:column;align-items:center;gap:4px}
.dstats{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-bottom:14px}
.dstats .ds{padding:10px;font-size:12px}.dstats .ds b{font-size:11px}.dstats .btn{width:100%}
.ds{background:#141B42;border:3px solid #3A4372;padding:12px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.ds b{font:14px var(--px);color:var(--sun);font-weight:400}

/* intro / end */
#intro{position:absolute;inset:0;z-index:40;background:rgba(7,10,28,.78);display:flex;align-items:center;justify-content:center}
.introBox{width:760px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:18px}
.introBox h1{margin:0;font:46px var(--px);color:var(--sun);text-shadow:0 6px 0 #8A2420;letter-spacing:2px}
.introBox p{margin:0;font-size:20px;line-height:1.45;max-width:640px;font-weight:500}
.how{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%}
.how div{background:#1A2250;border:3px solid #3A4372;padding:12px 10px;font-size:15px;line-height:1.3;display:flex;flex-direction:column;align-items:center;gap:8px}
.big{font-size:15px;height:62px;padding:0 30px;border-radius:18px;box-shadow:0 6px 0 rgba(0,0,0,.4);background:linear-gradient(#8DEB9E,#4DBE67);color:var(--ink)}
.big.alt{background:linear-gradient(#FFE680,#E0B020)}
#rotate{position:fixed;left:0;right:0;bottom:12px;text-align:center;font:12px var(--ui);color:var(--muted);display:none}
@media (orientation:portrait) and (max-width:700px){#rotate{display:block}}
@media (prefers-reduced-motion:reduce){.crew,.crew u::before,.crew u::after,.bubble,.nb .dot{animation:none}#scene.shake{animation:none}}
</style>

async function findGame(code){

    if(snap.exists){const c=JSON.parse(snap.data().json);if(c&&c.v===4&&(!g||(c.savedAt||0)>(g.savedAt||0)))g=c}
  }catch(e){}}
  return g;
}

}

const MUS={on:lsGet('mo:music')!=='off',timer:null,step:0,next:0,mode:'calm',out:null,nb:null};
const LEAD=[69,null,72,null,76,null,74,72,null,69,null,null,72,null,74,null, 65,null,69,null,72,null,74,null,72,null,69,null,65,null,null,null,

const ROOTS=[45,41,48,43], CHORDS=[[57,60,64],[53,57,60],[60,64,67],[55,59,62]], DROOTS=[40,36,38,35];
const hz=n=>440*Math.pow(2,(n-69)/12);
function mTone(n,t,d,type,v){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(hz(n),t);g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+Math.min(.06,d/3));g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(MUS.out);o.start(t);o.stop(t+d+.05)}
function mKick(t,v){const o=AC.createOscillator(),g=AC.createGain();o.frequency.setValueAtTime(150,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g);g.connect(MUS.out);o.start(t);o.stop(t+.2)}
function mNoise(t,d,v){if(!MUS.nb){const b=AC.createBuffer(1,AC.sampleRate*.2|0,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=Math.random()*2-1;MUS.nb=b}
  const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=MUS.nb;f.type='highpass';f.frequency.value=6000;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f);f.connect(g);g.connect(MUS.out);s.start(t);s.stop(t+d+.02)}
/* Combat theme: fast A-minor chiptune (Am - F - G - E) with a driving octave bass, drums and a hook you can hum */
const CB_ROOTS=[45,41,43,40];
const CB_LEAD=[76,null,76,74,76,null,72,null,69,null,72,74,76,null,null,null,
  77,null,77,76,77,null,72,null,69,null,72,76,77,null,null,null,
  79,null,77,76,74,null,71,null,67,null,71,74,76,null,74,null,
  71,null,74,null,76,null,80,null,76,null,74,null,71,null,68,null];
const CB_BASS=[0,0,12,0,0,12,0,12];
function mSnare(t,v){if(!MUS.nb)mNoise(t,.001,.0001);const s=AC.createBufferSource(),f=AC.createBiquadFilter(),g=AC.createGain();s.buffer=MUS.nb;f.type='bandpass';f.frequency.value=1900;f.Q.value=.8;
  g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.13);s.connect(f);f.connect(g);g.connect(MUS.out);s.start(t);s.stop(t+.15)}
function mStep(i,t,sp){
  const bar=(i>>4)&3,s=i&15;
  if(MUS.mode==='combat'){const r=CB_ROOTS[bar];
    if(s%2===0)mTone(r+CB_BASS[(s>>1)&7],t,sp*1.7,'square',.032);
    if(s%4===0)mKick(t,.09);
    if(s===4||s===12)mSnare(t,.07);
    if(s%2===1)mNoise(t,.03,.018);
    const ln=CB_LEAD[i];if(ln)mTone(ln,t,sp*1.8,'square',.022);
    if(s===6||s===14)mTone(CHORDS[bar][0]+(bar===3?-1:0),t,sp*1.2,'triangle',.02);
    return}
  if(MUS.mode==='danger'){const r=DROOTS[bar];if(s%4===0)mTone(r,t,sp*3,'triangle',.05);if(s%4===2)mTone(r+12+[0,3,7,12][(s>>2)%4],t,sp*2,'sine',.025);
    if(s%8===0)mKick(t,.06);return}
  const r=ROOTS[bar];if(s===0||s===8)mTone(r,t,sp*6,'sine',.08);
  const ln=LEAD[i];if(ln&&s%2===0)mTone(ln,t,sp*4,'sine',.03);
  if(s%4===2)mTone(CHORDS[bar][(s>>2)%3],t,sp*5,'sine',.02);
}
function musTick(){if(!AC||!MUS.out)return;
  if(MUS.mode!==MUS.lastMode){if(MUS.mode==='combat')MUS.step=0;MUS.lastMode=MUS.mode;if(MUS.lp)MUS.lp.frequency.value=MUS.mode==='combat'?2800:1600}

/* ================= read-aloud voice ================= */
let voiceOn=false, VOICE=null;
// Rank the computer's voices so the most human-sounding one wins.
// Best: neural "Natural"/"Online" voices (Edge, Windows 11), Apple Premium/Enhanced/Siri voices, Google voices in Chrome.
let VOICES=[];
function voiceScore(v){const n=v.name;let sc=0;
  if(/Natural/i.test(n))sc+=100; if(/Online/i.test(n))sc+=40; if(/Premium/i.test(n))sc+=90; if(/Enhanced/i.test(n))sc+=70; if(/Siri/i.test(n))sc+=60;
  if(/^Google/i.test(n))sc+=50; if(/Neural|WaveNet|Studio|Journey/i.test(n))sc+=80;
  if(/Ava|Jenny|Aria|Emma|Samantha|Allison|Zoe|Evan|Nathan|Andrew|Brian|Michelle|Sonia|Libby|Serena|Karen/i.test(n))sc+=15;
  if(/en-US/i.test(v.lang))sc+=10; else if(/en-GB|en-AU|en-CA|en-IE/i.test(v.lang))sc+=5;
  if(/Microsoft (David|Zira|Mark)\b/i.test(n)&&!/Natural|Online/i.test(n))sc-=30; // old robotic Windows voices
  if(/eSpeak|compact/i.test(n))sc-=60; return sc}
function pickVoice(){try{const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
  const odd=/Fred|Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Deranged|Good News|Hysterical|Junior|Organ|Ralph|Trinoids|Whisper|Zarvox|Superstar|Jester|Wobble|Eddy|Flo\b|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Espeak|Robot/i;
  VOICES=vs.filter(v=>!odd.test(v.name)).sort((a,b)=>voiceScore(b)-voiceScore(a));
  const saved=lsGet('mo:voiceName');VOICE=VOICES.find(v=>v.name===saved)||VOICES[0]||null}catch(e){}}
function nextVoice(){if(!VOICES.length)pickVoice();if(!VOICES.length)return null;const i=VOICES.indexOf(VOICE);VOICE=VOICES[(i+1)%VOICES.length];lsSet('mo:voiceName',VOICE.name);return VOICE}
function voiceLabel(){return VOICE?VOICE.name.replace(/^(Microsoft|Google|Apple)\s+/i,'').replace(/\s*\(.*$/,'').replace(/\s+Online.*$/i,'').slice(0,16):'DEFAULT'}
if('speechSynthesis' in window){pickVoice();try{speechSynthesis.onvoiceschanged=pickVoice}catch(e){}}
// Narrator voice: recorded lines made by tools/make_voice.py. A line with no recording
// is read by the browser's built-in voice instead. manifest.js is loaded by a script tag so this also works from a local file.
let VOICE_MAP=window.VOICE_MANIFEST||null, curAudio=null;
if(false){try{fetch('audio/manifest.json').then(r=>r.ok?r.json():null).then(m=>{VOICE_MAP=m}).catch(()=>{})}catch(e){}}
function vHash(str){let h=0x811c9dc5;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return h.toString(16).padStart(8,'0')}
function isSpeaking(){try{if(curAudio&&!curAudio.paused&&!curAudio.ended)return true;return 'speechSynthesis' in window&&(speechSynthesis.speaking||speechSynthesis.pending)}catch(e){return false}}
// Reads text aloud. Uses a recorded line if there is one, otherwise the browser's voice.
// soft=true: only speak if nothing else is being read (used for little pop-up messages).
function speak(t,force,soft){
  return; // voice removed
  if((!voiceOn&&!force)||!t)return;
  if(soft&&isSpeaking())return;
  const txt=String(t).replace(/<[^>]+>/g,' ').replace(/&nbsp;|&middot;/g,' ').replace(/&amp;/g,'and').replace(/MARS-(\w)(\w)(\w)(\w)/g,'MARS $1 $2 $3 $4').replace(/\s+/g,' ').trim();
  if(!txt)return;
  hush();
  const file=VOICE_MAP&&VOICE_MAP[vHash(txt)];
  if(file){try{curAudio=new Audio('audio/'+file);curAudio.play().catch(()=>ttsSpeak(txt));return}catch(e){}}
  ttsSpeak(txt);
}
function ttsSpeak(txt){
  if(!('speechSynthesis' in window))return;
  try{if(!VOICE)pickVoice();
    const neural=VOICE&&/Natural|Online|Premium|Enhanced|Siri|Neural|^Google/i.test(VOICE.name);
    // Make text easier to say: "-5 metal" -> "minus 5 metal", "+3" -> "plus 3", "x2" -> "times 2", shouting caps -> normal words
    const clean=txt.replace(/(^|\s)-(\d)/g,'$1minus $2').replace(/(^|\s)\+(\d)/g,'$1plus $2').replace(/\b(\d+)x\b/g,'$1 times')
      .replace(/\b([A-Z]{4,})\b/g,w=>w.charAt(0)+w.slice(1).toLowerCase());
    const parts=clean.match(/[^.!?]+[.!?]+["')]*|[^.!?]+$/g)||[clean];
    parts.map(x=>x.trim()).filter(Boolean).forEach(part=>{
      const u=new SpeechSynthesisUtterance(part);if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='en-US';
      u.rate=neural?1:.93;u.pitch=1;u.volume=1;
      if(/!$/.test(part)){u.rate+=.04;u.pitch=1.06}else if(/\?$/.test(part))u.pitch=1.04;
      speechSynthesis.speak(u)});
  }catch(e){}
}
function optsSpeech(list){list=list.map(x=>String(x).replace(/<[^>]+>/g,' ').trim());return list.length>1?' Is it: '+list.slice(0,-1).join('? ')+'? Or '+list[list.length-1]+'?':''}
function hush(){try{speechSynthesis.cancel()}catch(e){}try{if(curAudio){curAudio.pause();curAudio=null}}catch(e){}}
function setVoice(on){voiceOn=on;lsSet('mo:voice',on?'on':'off');if(!on)hush()}

function lsPeriod(){const n=S.res.lifeSupport;return 3/(1+.35*Math.max(0,n-1))}
function addRes(k,n){
  const r=S.res;
  if(['food','water','air','power'].includes(k)){r[k]=Math.min(CAP,r[k]+n)}else r[k]=(r[k]||0)+n;
}
function canPay(c){return Object.entries(c).every(([k,v])=>(S.res[k]||0)>=v)}

  return canPay(podCost());

function podCost(){const n=S.pods;return {metal:20+10*n,minerals:10+5*n,cells:4+2*n}}

function simulate(gs){
  const dt=gs/DAY_SEC; const before=Math.floor(S.t);
  S.t+=dt;
  if(Math.floor(S.t)>before)newDay(Math.floor(S.t)+1);
  const r=S.res;
  RATES=rates();
  for(const k of ['power','food','water','air'])r[k]=clamp(r[k]+RATES[k]*dt,0,CAP);
  // life support pulse
  if(r.lifeSupport>0){S.lsT+=dt*(r.power>0?1:.5);if(S.lsT>=lsPeriod()){S.lsT=0;const a=1+.5*(r.lifeSupport-1);
    for(const k of ['food','water','air','power'])addRes(k,a);S.life=Math.min(100,S.life+30);   // heals 30% of max life
    floatText(310,330,`+${a} supplies, +30% life`,'#6BE08A');sfx.coin();tip('Life support gave free supplies and healed the crew 30%!','ls1')}}
  // shield fades all the time (radiation), much faster in a solar flare
  S.shield=clamp(S.shield+RATES.defense*dt,0,maxShield());
  // crew health
  S.out=S.out||{};let dl=0;
  for(const k in PEN){
    if(isOut(k)){const was=S.out[k]||0;S.out[k]=was+dt;if(!was){sfx.alarm();say(PEN[k].say,'pen'+k)}dl-=PEN[k].hurt*outMult(k)}
    else S.out[k]=0;
  }
  if(dl===0&&r.food>.5&&r.water>.5&&r.air>.5)dl=3;
  S.life=clamp(S.life+dl*dt,0,100);
  // warnings
  if(r.power<=1.2&&S.up.power===0)tip('Power is low! Tap PEDAL, or build BIOFUEL in UPGRADES.','lowpow');
  if(r.power<=0)tip('Power is out! Machines stopped. Make power now!','nopow');
  for(const k of ['food','water','air'])if(r[k]<=1.5)tip(`Low on ${k}! Tap the ${k.toUpperCase()} button.`,'low'+k);
  if(S.shield<=0)tip('Shield is down! Radiation hurts the crew. Tap SHIELD.','noshield');
  // mine
  const da=drillsActive();
  if(da>0&&r.power>0){const capOre=12*S.mine.drills;const late=S.day>=7, dg=late?da*(dt*DAY_SEC/(S.speed||1))/DRILL_SEC:da*dt;S.mine.ore=Math.min(capOre,S.mine.ore+1*dg);S.mine.oreMetal=Math.min(capOre,S.mine.oreMetal+(late?3:2)*dg)}
  // quest
  const qa=S.quest.active;
  if(qa){qa.p+=dt*(isOut('food')?.5:1);if(qa.p>=qa.dur){S.quest.ready=qa.id;S.quest.active=null;sfx.right();toast('The explorers are back! Open QUESTS.','#8DEB9E')}}
  maybePopQuiz();
  // schedule
  for(const e of S.sched){
    if(e.done)continue;
    if(e.type==='wave'&&!e.warned&&S.t>=e.at-.125){e.warned=true;sfx.alarm();
      toast(e.scout?'Alien scouts are coming!':'Radar: aliens coming! Get ready!','#FF8A80');if(e.scout)tip('Scouts coming! Blasters shoot them. You can tap them too.','scout1')}
    if(S.t>=e.at){e.done=true;
      if(e.type==='wave')startWave(e);
      else if(e.type==='cme'){const I=DONKI_IPS[e.rec];sfx.alarm();say(`Sun alert! A shock wave hits in about ${Math.round(toT(I.eventTime)-toT(e.cmeTime))} days. Save power and shield! (Real NASA event: ${fmtDate(e.cmeTime)}.)`)}
      else{if(S.dis)endDisaster();startDisaster(e.kind,e)}}
  }
  // disaster timer
  if(S.dis){
    if(S.dis.kind==='fire'){for(const f of W.fires){f.age+=dt}
      S.dis.spread=(S.dis.spread||0)+dt;if(S.dis.spread>.06&&W.fires.length&&W.fires.length<9){S.dis.spread=0;const o=pick(W.fires);W.fires.push({x:clamp(o.x+rnd(-70,70),260,1240),y:o.y,age:0,ph:Math.random()*6})}
      W.fires=W.fires.filter(f=>f.age<DISASTER.fire.dur);if(!W.fires.length)endDisaster()}
    else if(S.t>=S.dis.end&&!(S.dis.kind==='meteor'&&(W.meteors.length||S.dis.left>0)))endDisaster();
  }
  // lose
  if(S.life<=0&&!S.over){S.over=true;gameOver()}
}

/* Spawn chances: every alien in a wave is picked at random with these weights.
   Aliens that have not started showing up yet (before their "from" day) are skipped, and their share goes to the others. */
const SPAWN={weak:25,flyer:17,blob:17,medium:13,spitter:13,brute:9,boss:6};
function spawnPool(d){return ORDER.filter(k=>d>=ALIEN[k].from)}
function spawnChanceToday(k,d){const p=spawnPool(d);if(!p.includes(k))return 0;return SPAWN[k]/p.reduce((s,x)=>s+SPAWN[x],0)}
function rollAlien(d,noBoss){const p=spawnPool(d).filter(k=>!(noBoss&&k==='boss'));let r=Math.random()*p.reduce((s,x)=>s+SPAWN[x],0);
  for(const k of p){r-=SPAWN[k];if(r<=0)return k}return p[0]}
function waveSize(d){return Math.min(28,Math.max(2,Math.round(2+(d-6)*1.35)))}
function rollWave(d){const comp={};for(let j=0;j<waveSize(d);j++){const k=rollAlien(d,comp.boss>=1);comp[k]=(comp[k]||0)+1}return comp}
function planDay(d){
  const ev=[], base=d-1;
  if(d>=3&&d<=5&&Math.random()<.65)ev.push({at:base+rnd(.15,.85),type:'wave',comp:{weak:ri(1,2)},scout:true});
  if(d>=6){
    const n=Math.min(3,1+Math.floor(Math.max(0,d-8)/6));
    for(let i=0;i<n;i++){
      const night=Math.random()<.6;
      ev.push({at:base+(night?rnd(.56,.94):rnd(.1,.44)),type:'wave',comp:rollWave(d)});
    }
  }
  // random disasters. Real NASA flares and shock waves (about 1 every 6 days) come on top of these,
  // so in total: about 1 every 4 to 5 days early on, about 1 every 3 to 4 days from day 8
  if(d>=2&&Math.random()<(d>=8?.13:.08))ev.push({at:base+rnd(.1,.9),type:'disaster',kind:pick(Object.keys(DISASTER).filter(k=>k!=='ips'))});
  // real NASA events land on their real dates (game day N = January N, 2016; repeats every 30 days)
  const cyc=Math.floor((d-1)/30)*30, inDay=t=>t+cyc>=base&&t+cyc<base+1;
  DONKI_FLR.forEach((F,i)=>{const t=toT(F.beginTime);if(inDay(t))ev.push({at:t+cyc,type:'disaster',kind:'flare',rec:i,real:true})});
  DONKI_IPS.forEach((I,i)=>{const t=toT(I.eventTime);if(inDay(t))ev.push({at:t+cyc,type:'disaster',kind:'ips',rec:i});
    I.cme.forEach(c=>{const ct=toT(c.slice(0,19)+'Z');if(inDay(ct))ev.push({at:ct+cyc,type:'cme',rec:i,cmeTime:c.slice(0,16)+'Z'})})});
  ev.sort((a,b)=>a.at-b.at);
  S.sched=ev;
}

/* Electro shield (shield level 2+) zaps aliens touching the dome. Gravity shield (level 3) lifts them and slams them down. */
function shieldPower(a){
  if(S.up.shield>=3&&!a.gravCd){a.grav={t:0,y0:a.y};a.atk=false;sfx.lift();floatText(a.x,a.y-a.h-20,'LIFT!','#B48CF0');return true}
  if(S.up.shield>=2&&!a.zapCd&&S.res.power>=ELECTRO.pw){const l=wlv('electro');S.res.power-=ELECTRO.pw;a.zapCd=ELECTRO.cd;a.stun=ELECTRO.stun(l);
    W.zaps.push({a,t:.35});sfx.zap();hurtAlien(a,ELECTRO.dmg(l),true);knock(a.x,ELECTRO_KB.r,ELECTRO_KB.px);return true}
  return false;
}
/* Push every alien near x a little away from the dome (less at the edge of the area) */
function knock(x,r,px){
  for(const al of W.aliens){if(al.hp<=0||al.grav)continue;const d=Math.abs(al.x-x);
    if(d<r){al.kb=(al.kb||0)+px*(1-.5*d/r)*8;al.hop=.22}}
}
/* Spitter lobs a blob of acid that arcs onto the dome */
function spit(a){
  const sx=a.x-a.side*(a.w/2-4), sy=a.y-a.h*.55;
  const sh=S.shield>0?1:.85, th=a.side<0?Math.PI+rnd(.15,.5):2*Math.PI-rnd(.15,.5);
  const tx=DOME_C+232*sh*Math.cos(th), ty=530+217*sh*Math.sin(th), T=SPIT.flight;
  W.acid.push({x:sx,y:sy,vx:(tx-sx)/T,vy:(ty-sy)/T-.5*SPIT.g*T,t:0,T,dmg:ALIEN[a.k].dmg*SPIT.cd});
  a.spitA=.3;burst(sx,sy,'#9BE83A',4);sfx.spit();
}
function gravSlam(x,y){
  const l=wlv('gravity'),dmg=GRAVITY.dmg(l),r=GRAVITY.r(l);
  sfx.slam();burst(x,y-6,'#B48CF0',20);W.rings.push({x,y:y-10,r:10,max:r+20,c:'#B48CF0'});W.flash=.15;
  $('#scene').classList.add('shake');setTimeout(()=>$('#scene').classList.remove('shake'),180);
  for(const al of [...W.aliens]){if(al.hp<=0)continue;const d=Math.hypot(al.x-x,al.y-y);if(d<r)hurtAlien(al,dmg*(d<r*.4?1:1-.5*(d-r*.4)/(r*.6)),true)}
  knock(x,r,GRAVITY_KB.px);
}
function nearest(x,y,range){let b=null,bd=range;for(const a of W.aliens){if(a.hp<=0)continue;const d=Math.hypot(a.x-x,(a.y-a.h/2)-y);if(d<bd){bd=d;b=a}}return b}

function combat(gs){
  // spawn queue
  for(const s of W.spawn)s.delay-=gs;
  for(const s of W.spawn.filter(s=>s.delay<=0))spawnAlien(s.k,s.side);
  W.spawn=W.spawn.filter(s=>s.delay>0);
  const pw=S.res.power>0;
  // aliens
  for(const a of W.aliens){
    a.ph+=gs*6;a.flash=Math.max(0,a.flash-gs);
    a.zapCd=Math.max(0,(a.zapCd||0)-gs);a.gravCd=Math.max(0,(a.gravCd||0)-gs);
    a.hop=Math.max(0,(a.hop||0)-gs);a.spitA=Math.max(0,(a.spitA||0)-gs);
    // knockback slide from the electro and gravity shields (works even while stunned)
    if(a.kb&&!a.grav){const k=Math.exp(-8*gs);a.x=clamp(a.x+a.side*a.kb*(1-k)/8,-a.w,1280+a.w);a.kb*=k;if(a.kb<1)a.kb=0}
    if(a.grav){const g=a.grav;g.t+=gs;
      if(g.t<GRAVITY.lift)a.y=g.y0-95*Math.sin(Math.min(1,g.t/GRAVITY.lift)*Math.PI/2);
      else{a.y=Math.min(g.y0,a.y+1100*gs);if(a.y>=g.y0){a.y=g.y0;a.grav=null;a.gravCd=GRAVITY.cd;gravSlam(a.x,g.y0)}}
      continue}
    if(a.stun>0){a.stun-=gs;continue}
    const rng=a.rng||0, stopL=DOME_L-a.w/2+12-rng, stopR=DOME_R+a.w/2-12+rng;
    if(a.side<0&&a.x<stopL){a.x=Math.min(stopL,a.x+a.spd*gs);a.atk=false;a.wp+=a.spd*gs*.22}
    else if(a.side>0&&a.x>stopR){a.x=Math.max(stopR,a.x-a.spd*gs);a.atk=false;a.wp+=a.spd*gs*.22}
    else{a.atk=true;
      // spitters stand still and lob acid instead of hitting the dome
      if(rng){if(a.spitT===undefined)a.spitT=rnd(.2,.7);a.spitT-=gs;if(a.spitT<=0){a.spitT=SPIT.cd;spit(a)}continue}
      if(S.shield>0&&shieldPower(a))continue;
      const dmg=ALIEN[a.k].dmg*(a.mini?.5:1)*gs;
      if(S.shield>0){S.shield=Math.max(0,S.shield-dmg);W.flash=.15}else{S.life=Math.max(0,S.life-dmg*.35);
        if(Math.random()<gs*.8){const k=pick(['food','water','air','metal','biomass','cells']);if(S.res[k]>=.5){S.res[k]-=.5;floatText(a.x,a.y-a.h-26,'-0.5 '+RES[k].n,'#FF8A80');tip('Aliens are stealing supplies! Tap SHIELD.','steal')}}}
      if(Math.random()<gs*1.2)sfx.hit();
      if(S.life<=0&&!S.over){S.over=true;gameOver()}}
  }
  // spitter acid in flight
  for(const p of W.acid){p.t+=gs;p.x+=p.vx*gs;p.y+=p.vy*gs;p.vy+=SPIT.g*gs;
    if(p.t>=p.T){p.dead=true;burst(p.x,p.y,'#9BE83A',10);burst(p.x,p.y,'#B6FF3B',6);sfx.hit();
      if(S.shield>0){S.shield=Math.max(0,S.shield-p.dmg);W.flash=.15}else S.life=Math.max(0,S.life-p.dmg*.35);
      if(S.life<=0&&!S.over){S.over=true;gameOver()}}}
  W.acid=W.acid.filter(p=>!p.dead);
  for(const a of W.aliens)if(ALIEN[a.k].flies&&!a.grav&&!(a.stun>0)){const ty=a.atk?GROUND-30:GROUND-110+Math.sin(a.ph*.5)*14;a.y+=(ty-a.y)*Math.min(1,gs*4)}
  W.aliens=W.aliens.filter(a=>a.hp>0);
  // blasters
  for(let i=0;i<2;i++){
    W.fireT[i]-=gs;const t=TUR[i];const a=nearest(t.x,t.y,520);t.tgt=a;
    if(a&&W.fireT[i]<=0){W.fireT[i]=.4*(isOut('food')||isOut('power')?2:1);W.shots.push({x:t.x,y:t.y-8,a});sfx.shot()}
  }
  for(const s of W.shots){
    if(!s.a||s.a.hp<=0){s.dead=true;continue}
    const tx=s.a.x,ty=s.a.y-s.a.h/2,dx=tx-s.x,dy=ty-s.y,d=Math.hypot(dx,dy),st=760*gs;
    if(d<=st){hurtAlien(s.a,4*wmul('gun'),false,'gun');s.dead=true}else{s.x+=dx/d*st;s.y+=dy/d*st}
  }
  W.shots=W.shots.filter(s=>!s.dead);
  // laser
  W.laserTgt=null;
  if(S.up.offense>=2&&pw&&S.tog.lasers){const a=nearest(LASER.x,LASER.y,600);if(a){W.laserTgt=a;hurtAlien(a,15*gs*wmul('laser'));S.res.power=Math.max(0,S.res.power-.012*gs)}}
  // plasma cannon: big slow ball, area damage where it lands
  W.plasmaT=(W.plasmaT||0)-gs;W.plasmaShots=W.plasmaShots||[];W.plasmaTgt=null;
  if(S.up.offense>=4&&pw&&S.tog.plasma!==false){
    const a=nearest(PLASMA.x,PLASMA.y,650);W.plasmaTgt=a;
    if(a&&W.plasmaT<=0&&S.res.power>=.1){W.plasmaT=2.6;S.res.power-=.1;const py=PLASMA.y-13,an=Math.atan2((a.y-a.h/2)-py,a.x-PLASMA.x);
      W.plasmaShots.push({x:PLASMA.x+Math.cos(an)*PLASMA_MZ,y:py+Math.sin(an)*PLASMA_MZ,tx:a.x,ty:a.y-a.h/2});sfx.emp()}
  }
  for(const p of W.plasmaShots){const dx=p.tx-p.x,dy=p.ty-p.y,d=Math.hypot(dx,dy),st=430*gs;
    if(d<=st){p.dead=true;burst(p.tx,p.ty,'#B48CF0',22);sfx.hit();W.rings.push({x:p.tx,y:p.ty,r:10,max:130,c:'#B48CF0'});W.rings.push({x:p.tx,y:p.ty,r:4,max:70,c:'#FFF6E5'});burst(p.tx,p.ty,'#FFF6E5',12);
      // splash: full damage close to the blast, falling to half damage at the edge of the 120 pixel radius
      const dmg=60*wmul('plasma');for(const al of W.aliens){const dd=Math.hypot(al.x-p.tx,(al.y-al.h/2)-p.ty);if(dd<120)hurtAlien(al,dd<40?dmg:dmg*(1-.5*(dd-40)/80),true)}}
    else{p.x+=dx/d*st;p.y+=dy/d*st}}
  W.plasmaShots=W.plasmaShots.filter(p=>!p.dead);
  // emp
  if(S.up.offense>=3&&pw&&S.tog.emp){
    W.empCharge=Math.min(1,W.empCharge+gs/9);
    if(W.empCharge>=1&&S.res.power>=1.5&&W.aliens.some(a=>Math.abs(a.x-DOME_C)<EMP_R)){
      W.empCharge=0;S.res.power-=1.5;sfx.emp();W.empFlash=.35;W.rings.push({x:DOME_C,y:470,r:20,max:EMP_R+20});W.rings.push({x:DOME_C,y:265,r:6,max:110,c:'#DFF8FF'});
      // freezes everything that moves inside the blast: walkers, flyers, knockback slides, and acid in the air
      for(const a of W.aliens)if(Math.abs(a.x-DOME_C)<EMP_R){a.stun=2.5;a.kb=0;hurtAlien(a,12*wmul('emp'),true)}
      for(const p of W.acid)if(Math.abs(p.x-DOME_C)<EMP_R){p.dead=true;burst(p.x,p.y,'#4FC3F7',6)}
      W.acid=W.acid.filter(p=>!p.dead);
      tip('EMP blast! Aliens frozen.','emp1');
    }
  }
  for(const z of W.zaps)z.t-=gs;W.zaps=W.zaps.filter(z=>z.t>0);
  for(const r of W.rings)r.r+=600*gs;W.rings=W.rings.filter(r=>r.r<r.max);
  // meteors
  if(S.dis&&S.dis.kind==='meteor'&&S.dis.left>0){S.dis.nt-=gs;if(S.dis.nt<=0){S.dis.nt=rnd(.8,1.6);S.dis.left--;
    const tx=rnd(440,800),sx=tx+rnd(-500,300);W.meteors.push({x:sx,y:-40,tx,ty:rnd(380,420),spd:rnd(150,200)})}}
  for(const m of W.meteors){const dx=m.tx-m.x,dy=m.ty-m.y,d=Math.hypot(dx,dy),st=m.spd*gs;
    if(d<=st){m.dead=true;burst(m.x,m.y,'#FFB070',14);sfx.hit();
      if(S.shield>0){S.shield=Math.max(0,S.shield-14);W.flash=.2}else S.life=Math.max(0,S.life-12)}
    else{m.x+=dx/d*st;m.y+=dy/d*st}}
  W.meteors=W.meteors.filter(m=>!m.dead);
}

/* ================= disasters ================= */
function startDisaster(kind,e){
  const D=DISASTER[kind];
  S.dis={kind,end:S.t+D.dur};sfx.alarm();
  if(kind==='flare'){
    const i=e&&e.rec!=null?e.rec:ri(0,DONKI_FLR.length-1), F=DONKI_FLR[i], m=flareMult(F.classType);
    const dur=Math.max(.04,toT(F.endTime)-toT(F.beginTime));
    Object.assign(S.dis,{mult:m,cls:F.classType,end:S.t+dur,rows:[['How big',flareSize(F.classType)+' ('+F.classType+')'],['Power',m>1.2?'Going down VERY fast':'Going down fast'],['Shield',m>1.2?'Going down VERY fast':'Going down fast'],['Lasts','About '+Math.round(dur*1440)+' minutes']],
      fact:`${e&&e.real?'This really happened on this day!':'This copies a real flare.'} NASA satellites saw it on ${fmtDate(F.beginTime)}. Scientists name flares by size with letters: A, B, C, M and X. X flares are the biggest!`});
  }
  if(kind==='ips'){
    const I=DONKI_IPS[e&&e.rec!=null?e.rec:0];
    S.dis.rows=[['Power','Big drop'],['Shield','Big drop'],['How often','Very rare']];
    S.dis.fact=`This really happened! ${where(I.location)} felt it on ${fmtDate(I.eventTime)}.`+(I.cme.length?' It was pushed by a giant cloud the Sun threw out a few days before.':' Nobody saw this one coming!');
    $('#flareTint').classList.add('ips');$('#scene').classList.add('shake');setTimeout(()=>$('#scene').classList.remove('shake'),2500);
    decide('SHOCK WAVE FROM THE SUN!',`A giant wave of energy from the Sun is crashing into Mars, like a huge ocean wave! NASA really saw this one on ${fmtDate(I.eventTime)}. It will hurt our power and shield a lot, whatever we do.`,[
      {l:'Brace! Shut everything down',c:'Lose 40% of power and 40% of shield. Drills stop for half a day.',fn:()=>{S.res.power*=.6;S.shield*=.6;S.mine.pauseUntil=Math.max(S.mine.pauseUntil,S.t+.5)}},
      {l:'Keep everything running',c:'Lose 70% of power and 80% of shield.',fn:()=>{S.res.power*=.3;S.shield*=.2}}]);
  }
  if(kind==='dust'){$('#dustTint').style.opacity=.45;
    if(S.up.power>=2)decide('DUST STORM!','Red dust is blowing over the outpost. It covers the solar panels so they barely work.',[
      {l:'Send crew to clean the panels',c:'-1 air, -5 crew health. Solar works normally.',ok:()=>S.res.air>=1,fn:()=>{S.res.air-=1;S.life-=5;S.dis.clean=true}},
      {l:'Wait inside',c:'SOLAR makes only 1.2 power until the storm ends.',fn:()=>{}}]);
    else decide('DUST STORM!','Red dust is blowing hard. It can leak in through the airlocks.',[
      {l:'Seal the dome',c:'-1.5 power to run the seals.',ok:()=>S.res.power>=1.5,fn:()=>{S.res.power-=1.5}},
      {l:'Leave it open',c:'Dust leaks in: -1 air, -1 water.',fn:()=>{S.res.air=Math.max(0,S.res.air-1);S.res.water=Math.max(0,S.res.water-1)}}]);}
  if(kind==='flare'){$('#flareTint').classList.add('on');
    decide('SOLAR FLARE!',`A ${flareSize(S.dis.cls)} flash of energy from the Sun is hitting Mars! (NASA really saw this flare.) Our power and shield will go down ${S.dis.mult>1.2?'VERY ':''}fast for ${S.dis.rows[3][1].toLowerCase()}.`,[
      {l:'Hide the crew in the bunker',c:'-1 food, -1 water. Crew is safe, but no buttons work until it ends.',ok:()=>S.res.food>=1&&S.res.water>=1,fn:()=>{S.res.food-=1;S.res.water-=1;S.dis.bunker=true}},
      {l:'Keep working',c:'-15 crew health from radiation. Buttons cost 50% more power.',fn:()=>{S.life=Math.max(1,S.life-15)}}]);}
  if(kind==='fire'){
    const spots=[[300,520],[480,528],[760,528],[960,520],[1060,520],[1200,525],[600,530]];
    spots.sort(()=>Math.random()-.5).slice(0,ri(4,5)).forEach(([x,y])=>W.fires.push({x:x+rnd(-15,15),y,age:0,ph:Math.random()*6}));
    tip('Fire! Tap each fire to put it out.','fire1');
  }
  if(kind==='quake'){
    $('#scene').classList.add('shake');setTimeout(()=>$('#scene').classList.remove('shake'),4500);
    S.shield=Math.max(0,S.shield-maxShield()*.25);S.mine.pauseUntil=S.t+.15;
    decide('MARSQUAKE!','The ground is shaking! The shield got hurt and the drill tower is bent.',[
      {l:'Fix it right away',c:'-5 metal. Drills start again.',ok:()=>S.res.metal>=5,fn:()=>{S.res.metal-=5;S.mine.pauseUntil=S.t}},
      {l:'Fix it later',c:'Drills stop for half a day, and the shield loses 10 more.',fn:()=>{S.mine.pauseUntil=S.t+.5;S.shield=Math.max(0,S.shield-10)}}]);
  }
  if(kind==='meteor'){S.dis.left=ri(7,10);S.dis.nt=.5;tip('Meteors! Tap them before they hit. They drop metal.','met1')}
}
function endDisaster(){
  if(!S.dis)return;
  if(S.dis.kind==='dust')$('#dustTint').style.opacity=0;
  if(S.dis.kind==='ips'){$('#flareTint').classList.remove('ips');toast('The shock wave has passed.','#8DEB9E')}
  if(S.dis.kind==='flare'){$('#flareTint').classList.remove('on');if(S.dis.bunker)toast('The solar flare is over. The crew left the bunker.','#8DEB9E')}
  S.dis=null;W.fires=[];
}

/* ================= effects ================= */
function floatText(x,y,t,c){W.texts.push({x,y,t,c,life:1.2})}
function burst(x,y,c,n){for(let i=0;i<n;i++)W.parts.push({x,y,vx:rnd(-160,160),vy:rnd(-220,40),c:Math.random()<.5?c:'#FFD84A',life:rnd(.4,.8),s:ri(3,6)})}
function invPos(){const b=[...document.querySelectorAll('#nav .nb')].filter(x=>x.style.display!=='none').pop();if(!b)return {x:1072,y:671};
  const r=b.getBoundingClientRect(),o=$('#stage').getBoundingClientRect();return {x:(r.left+r.width/2-o.left)/scale,y:(r.top+r.height/2-o.top)/scale}}
function effects(gs,rdt){
  for(const p of W.parts){p.x+=p.vx*gs;p.y+=p.vy*gs;p.vy+=500*gs;p.life-=gs}
  W.parts=W.parts.filter(p=>p.life>0);
  for(const t of W.texts){t.y-=36*rdt;t.life-=rdt}
  W.texts=W.texts.filter(t=>t.life>0);
  const IP=invPos();
  for(const d of W.drops){
    d.t+=gs;
    if(!d.fly){d.x+=d.vx*gs;d.y+=d.vy*gs;d.vy+=700*gs;if(d.y>GROUND-6){d.y=GROUND-6;d.vy=0;d.vx*=.5}if(d.t>.9)d.fly=true}
    else{const dx=IP.x-d.x,dy=IP.y-d.y,dist=Math.hypot(dx,dy),st=900*gs;
      if(dist<=st){d.dead=true;addRes(d.k,d.n);sfx.coin();floatText(IP.x+rnd(-40,40),540,`+${d.n} ${RES[d.k].n}`,'#FFD84A')}
      else{d.x+=dx/dist*st;d.y+=dy/dist*st}}
  }
  W.drops=W.drops.filter(d=>!d.dead);
  // dust particles
  const dusty=S.dis&&S.dis.kind==='dust';
  if(dusty&&W.dust.length<140)for(let i=0;i<6;i++)W.dust.push({x:1300+rnd(0,200),y:rnd(90,620),v:rnd(380,700),l:rnd(10,40)});
  for(const p of W.dust)p.x-=p.v*Math.max(gs,rdt*.3);
  W.dust=W.dust.filter(p=>p.x>-50&&(dusty||Math.random()>.02));
  W.flash=Math.max(0,W.flash-rdt);W.empFlash=Math.max(0,(W.empFlash||0)-rdt);
}

function render(){
  ctx.clearRect(0,0,1280,720);
  const now=performance.now()/1000;
  // shield bubble
  const l=S.up.shield, ms=maxShield();
  if(S.shield>0&&l>=2){
    ctx.save();ctx.globalAlpha=.10+.08*(S.shield/ms)+W.flash;
    ctx.strokeStyle=l>=3?'#B48CF0':'#4FC3F7';ctx.lineWidth=6;ctx.setLineDash([12,8]);ctx.lineDashOffset=-now*20;
    ctx.beginPath();ctx.ellipse(DOME_C,530,230,215,0,Math.PI,0);ctx.stroke();ctx.restore();
  } else if(W.flash>0){ctx.save();ctx.globalAlpha=W.flash*2;ctx.fillStyle='#FFFFFF';ctx.beginPath();ctx.ellipse(DOME_C,530,200,200,0,Math.PI,0);ctx.fill();ctx.restore()}
  // electro shield: lightning crawling around the dome
  if(S.shield>0&&l>=2){ctx.save();ctx.lineCap='round';
    const arcs=3+wlv('electro');for(let i=0;i<arcs;i++){let ang=Math.PI+Math.random()*Math.PI;const span=.18+Math.random()*.25;
      ctx.beginPath();for(let j=0;j<=6;j++){const t=ang+span*j/6,j2=j&&j<6?rnd(-9,9):0;const px=DOME_C+(232+j2)*Math.cos(t),py=530+(217+j2)*Math.sin(t);j?ctx.lineTo(px,py):ctx.moveTo(px,py)}
      ctx.strokeStyle='rgba(79,195,247,.35)';ctx.lineWidth=7;ctx.stroke();ctx.strokeStyle='#DFF8FF';ctx.lineWidth=2;ctx.stroke()}
    for(const z of W.zaps){const a=z.a;if(!a)continue;const tx=a.x,ty=a.y-a.h/2,ang=Math.atan2(ty-530,tx-DOME_C),sx=DOME_C+232*Math.cos(ang),sy=530+217*Math.sin(ang);
      ctx.beginPath();ctx.moveTo(sx,sy);for(let j=1;j<6;j++){const k=j/6;ctx.lineTo(sx+(tx-sx)*k+rnd(-10,10),sy+(ty-sy)*k+rnd(-10,10))}ctx.lineTo(tx,ty);
      ctx.globalAlpha=Math.min(1,z.t*4);ctx.strokeStyle='rgba(79,195,247,.5)';ctx.lineWidth=9;ctx.stroke();ctx.strokeStyle='#FFFFFF';ctx.lineWidth=3;ctx.stroke();ctx.globalAlpha=1}
    ctx.restore()}
  // turrets
  for(const t of TUR){drawTower(t.x,t.y+2);drawTurret(t.x,t.y,t.tgt,'#9AA2BC')}
  if(S.up.offense>=3)drawEmpTower(DOME_C,332,now);
  const lm=S.up.offense>=2?drawLaserTurret(LASER.x,LASER.y,W.laserTgt,now):null;
  if(S.up.offense>=4)drawPlasmaTurret(PLASMA.x,PLASMA.y,W.plasmaTgt,now);
  for(const p of (W.plasmaShots||[])){ctx.fillStyle='rgba(180,140,240,.35)';ctx.beginPath();ctx.arc(p.x,p.y,17,0,7);ctx.fill();ctx.fillStyle='#B48CF0';ctx.beginPath();ctx.arc(p.x,p.y,10,0,7);ctx.fill();ctx.fillStyle='#FFF6E5';ctx.beginPath();ctx.arc(p.x,p.y,4,0,7);ctx.fill()}
  // laser beam
  if(W.laserTgt&&lm){const a=W.laserTgt;ctx.save();ctx.strokeStyle='rgba(255,59,48,.35)';ctx.lineWidth=8;ctx.beginPath();ctx.moveTo(lm.x,lm.y);ctx.lineTo(a.x,a.y-a.h/2);ctx.stroke();

    ctx.moveTo(x-lx(y0),y0);ctx.lineTo(x+lx(y1),y1);ctx.moveTo(x+lx(y0),y0);ctx.lineTo(x-lx(y1),y1)}

function nodeInfo(nd){
  if(nd.t==='root')return {n:'Pedal Power',ic:'power',st:'owned',body:'The crew rides bikes that make electricity. The PEDAL button works until you build Biofuel.',cost:null};
  if(nd.t==='tier'){const T=TRACKS[nd.track],tier=T.tiers[nd.i],lvl=S.up[nd.track];
    const st=nd.i<lvl?'owned':nd.i===lvl?'next':'locked';
    return {n:tier.n,ic:TIER_IC[nd.track][nd.i],st,body:(INFO[nd.track]||INFO.need)[nd.i],fact:tier.fact,cost:tier.cost,
      btn:`data-buy="${nd.track}"`,need:st==='locked'?T.tiers[nd.i-1].n:null}}
  if(nd.t==='wl'){const l=wlv(nd.k),built=nd.k==='shield'?true:nd.k==='electro'?S.up.shield>=2:nd.k==='gravity'?S.up.shield>=3:S.up.offense>['gun','laser','emp','plasma'].indexOf(nd.k);
    const st=l>=nd.L?'owned':l===nd.L-1&&built?'next':'locked';
    return {n:WL_NAME[nd.k]+' Lv '+nd.L,ic:WL_IC[nd.k],st,body:WL_DESC[nd.k]?`Level ${nd.L}: `+WL_DESC[nd.k](nd.L)+` (now level ${wlv(nd.k)})`:`Makes ${WL_NAME[nd.k]} ${Math.round(WL_STEP*100)}% stronger (level ${nd.L} of ${WL_MAX}).`,cost:WL_COST[nd.k][nd.L-2],
      btn:`data-wl="${nd.k}"`,need:st==='locked'?(built?WL_NAME[nd.k]+' Lv '+(nd.L-1):WL_NAME[nd.k]):null}}
  if(nd.t==='pod')return {n:'Life Support Pod',ic:'life',st:'next',lv:'x'+S.res.lifeSupport,body:'Each pod makes life support refill faster and give more. Uses a bit more power every day. You can build as many as you like.',
    fact:'Life support recycles air and water and grows a little food.',cost:podCost(),btn:'data-buy="pod"'};
  if(nd.t==='rocket'){const n=PARTS.filter(p=>S.rocket[p.k]).length;
    return {n:'Rocket Home',ic:'metal',st:n>=5?'owned':'next',lv:n+'/5',body:`${n} of 5 rocket parts built. Build all 5, then launch to fly home and win!`,cost:null,open:true}}
}
function tabHasBuy(tab){return tab.nodes.some(nd=>{const f=nodeInfo(nd);return f.st==='next'&&f.cost&&Object.keys(f.cost).length&&canPay(f.cost)})}
function openUpgrades(){
  const tab=UTABS.find(t=>t.id===UPG.tab)||UTABS[0];
  let sel=tab.nodes.find(n=>n.id===UPG.sel);
  if(!sel)sel=tab.nodes.find(n=>nodeInfo(n).st==='next')||tab.nodes[0];
  UPG.sel=sel.id;
  const CW=190,RH=134,X0=34,Y0=30,NW=136,NH=104,pos=n=>({x:X0+n.col*CW,y:Y0+n.row*RH});
  let lines='';
  for(const nd of tab.nodes){if(!nd.parent)continue;const p=tab.nodes.find(x=>x.id===nd.parent),a=pos(p),b=pos(nd),st=nodeInfo(nd).st;
    const c=st==='owned'?'#6BE08A':st==='next'?'#FFD84A':'#3A4372';
    const d=p.row===nd.row?`M${a.x+NW} ${a.y+NH/2}H${b.x}`:p.col===nd.col?`M${a.x+NW/2} ${a.y+NH}V${b.y}`:`M${a.x+NW/2} ${a.y+NH}V${b.y+NH/2}H${b.x}`;
    lines+=`<path d="${d}" stroke="${c}" stroke-width="7" fill="none" stroke-linecap="square"${st==='locked'?' stroke-dasharray="10 8"':''}/>`}
  const nodes=tab.nodes.map(nd=>{const f=nodeInfo(nd),p=pos(nd),can=f.st==='next'&&f.cost&&canPay(f.cost);
    return `<button class="tn ${f.st}${can?' can':''}${nd.id===sel.id?' sel':''}" data-node="${nd.id}" style="left:${p.x}px;top:${p.y}px">${ic(f.ic,30)}<span>${f.n}</span><small>${f.lv||(f.st==='owned'?'OWNED':f.st==='next'?(can?'READY':'NEXT'):'LOCKED')}</small></button>`}).join('');
  const f=nodeInfo(sel), hasCost=f.cost&&Object.keys(f.cost).length;
  let act='';
  if(f.open)act=`<button class="btn go" data-rocket="1" style="height:46px">Open rocket</button>`;
  else if(f.st==='owned')act='<button class="btn ok" tabindex="-1" style="height:46px">Owned</button>';
  else if(f.st==='locked')act=`<button class="btn lock" tabindex="-1" style="height:46px">Locked</button><div class="hint">Build <b style="color:var(--cream)">${f.need}</b> first.</div>`;
  else{const can=canPay(f.cost);act=`<button class="btn ${can?'':'off'}" ${f.btn} style="height:46px">${can?'Build':'Need more'}</button>`}
  const det=`<div class="udet"><div style="display:flex;align-items:center;gap:12px">${ic(f.ic,44)}<div><div class="px" style="font-size:13px;line-height:1.4">${f.n.toUpperCase()}</div>
      <div class="px" style="font-size:9px;margin-top:4px;color:${f.st==='owned'?'var(--green)':f.st==='next'?'var(--sun)':'var(--muted)'}">${f.st==='owned'?'BUILT':f.st==='next'?'CAN BUILD NEXT':'LOCKED'}</div></div></div>
    <div style="font-size:15px;line-height:1.35;color:#8FD8F0">${f.body}</div>
    ${f.fact?`<div class="fact" style="margin:0;font-size:14px;padding:10px 12px">${f.fact}</div>`:''}
    ${hasCost&&f.st!=='owned'?`<div class="sub" style="margin:4px 0 0">COST</div><div class="cost" style="display:flex;flex-direction:column;gap:6px;font-size:14px">${costHTML(f.cost)}</div>`:''}
    <div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">${act}</div></div>`;
  const tabs=UTABS.map(t=>`<button class="utab${t.id===tab.id?' on':''}" data-tab="${t.id}" style="--tc:${t.col}">${ic(t.i,20)}${t.n}${tabHasBuy(t)?'<i class="pd">+</i>':''}</button>`).join('');
  const html=`<div class="full">
    <div class="fhead"><h2>Upgrades</h2>${resPills(['metal','cells','uranium','biomass','minerals','steel'])}<button class="back" data-close>Back to outpost</button></div>
    <div class="utabs">${tabs}</div>
    <div class="upane" style="--tc:${tab.col}">
      <div class="tree"><div class="tnote">${tab.note} <span style="color:var(--sun)">Gold</span> = build next, <span style="color:var(--green)">green</span> = built. Every upgrade adds a little power upkeep.</div>
        <div class="tcan"><svg class="tlines" width="800" height="420">${lines}</svg>${nodes}</div></div>
      ${det}
    </div></div>`;
  openModal(html,true);
  const o=$('#overlay');
  o.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{sfx.click();UPG.tab=b.dataset.tab;UPG.sel=null;openUpgrades()}));
  o.querySelectorAll('[data-node]').forEach(b=>b.addEventListener('click',()=>{sfx.click();UPG.sel=b.dataset.node;openUpgrades()}));
  o.querySelectorAll('[data-buy]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();buy(b.dataset.buy)}));
  o.querySelectorAll('[data-wl]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();UPG.sel=null;wlUp(b.dataset.wl,openUpgrades)}));
  o.querySelectorAll('[data-rocket]').forEach(b=>b.addEventListener('click',e=>{e.stopPropagation();closeModal();openRocket()}));
}
function buy(track){
  UPG.sel=null;
  if(track==='pod'){const c=podCost();if(!canPay(c)){sfx.wrong();return}pay(c);S.pods++;S.res.lifeSupport++;sfx.buy();toast('Life support pod built!','#8DEB9E');openUpgrades();return}
  const T=TRACKS[track],lvl=S.up[track],tier=T.tiers[lvl];
  if(!tier||!canPay(tier.cost)){sfx.wrong();toast('Not enough supplies. The red numbers show what is missing.','#FF8A80');return}
  pay(tier.cost);S.up[track]++;sfx.buy();if(track==='offense'&&S.up.offense>=4)S.tog.plasma=true;
  if(track==='shield')S.shield=Math.min(maxShield(),S.shield+40);
  toast(tier.n+' built!','#8DEB9E');tip(tier.n+' built! '+(INFO[track]||INFO.need)[lvl],'built'+tier.n);
  openUpgrades();tutEvent('buy:'+track);
}

function expandCost(){const n=(S.mine.slots-2)/2;return {metal:15+10*n,minerals:10+6*n}}

    <div class="grid" style="grid-template-columns:repeat(8,1fr);gap:10px;margin-bottom:16px">${slots}</div>

      <div class="ds"><b>BIGGER MINE</b><span>Room for 2 more drills (${m.slots} of 8 now).</span><div class="cost" style="display:flex;gap:8px;font-size:13px">${m.slots>=8?'Max size':costHTML(ec)}</div>
        <button class="btn ${canExp?'':'off'}" id="expand">${m.slots>=8?'Max':'Expand'}</button></div>
    </div>
    <div class="fact" style="font-size:15px">Mars rocks are full of iron. When iron rusts it turns red, and that is why Mars is called the Red Planet!</div>
  </div>`;
  openModal(html);
  $('#collect').onclick=()=>{const a=Math.floor(m.ore),b=Math.floor(m.oreMetal);if(!a&&!b)return;if(S.res.power<.5){sfx.wrong();toast('The ore cart needs 0.5 power.','#FF8A80');return}S.res.power-=.5;S.res.minerals+=a;S.res.metal+=b;m.ore-=a;m.oreMetal-=b;sfx.buy();toast(`Collected ${a} minerals and ${b} metal`,'#8DEB9E');openMines()};

  c.imageSmoothingEnabled=false;c.save();try{sc.draw(c,MV.t)}catch(e){}c.restore();
  if(MV.t>=sc.d&&!(voiceOn&&MV.t<sc.d+15&&isSpeaking())){if(MV.i<L.length-1)mvScene(MV.i+1);else return mvEnd()}
  MV.raf=requestAnimationFrame(mvLoop)}

let tutI=-1;
function startTut(){capQ.length=0;nextSay();tutI=0;showTut()}
function tutEnd(silent){document.querySelectorAll('.spot').forEach(e=>e.classList.remove('spot'));$('#tut').style.display='none';if(tutI>=0&&!silent){toast('Tutorial done! Have fun.','#8DEB9E');hush()}tutI=-1}
function showTut(){
  document.querySelectorAll('.spot').forEach(e=>e.classList.remove('spot'));
  if(tutI<0||tutI>=TUT.length)return tutEnd();
  const st=TUT[tutI], txt=st.t.replace('CODE',S.code), last=tutI===TUT.length-1;
  if(st.el)document.querySelectorAll(st.el).forEach(e=>e.classList.add('spot'));
  const box=$('#tut');box.style.display='flex';
  if(st.pos==='bottom'){box.style.top='auto';box.style.bottom='16px'}else{box.style.bottom='auto';box.style.top=st.pos==='top'?'12px':(st.el==='#dome'?'100px':'150px')}
  box.innerHTML=`<div class="face">${svg(SPR.captain,60,60)}</div><div class="say"><b>CAPTAIN NOVA &middot; STEP ${tutI+1} OF ${TUT.length}</b><span>${txt}</span>
    <div class="tb">${tutI?'<button id="tBack">BACK</button>':''}<button id="tSkip">SKIP TUTORIAL</button><button class="nx" id="tNext" ${st.wait?'style="background:#E3DCCB"':''}>${last?'START PLAYING':st.wait?'SKIP STEP':'NEXT'}</button></div></div>`;
  const needsModal=x=>x&&(x.inModal||x.wait==='close');
  $('#tNext').onclick=()=>{sfx.click();tutQuiet=true;if(modal&&needsModal(st))closeModal();tutQuiet=false;tutI++;while(tutI<TUT.length&&((!modal&&needsModal(TUT[tutI]))||(TUT[tutI].wait&&TUT[tutI].el&&!document.querySelector(TUT[tutI].el))))tutI++;showTut()};
  $('#tSkip').onclick=()=>{sfx.click();tutEnd()};
  const bk=$('#tBack');if(bk)bk.onclick=()=>{sfx.click();tutI--;if(modal&&!needsModal(TUT[tutI])){tutQuiet=true;closeModal(true);tutQuiet=false}while(tutI>0&&!modal&&needsModal(TUT[tutI]))tutI--;showTut()};
  hush();
}
let tutQuiet=false;
function tutEvent(name){
  if(tutI<0||tutQuiet)return;const st=TUT[tutI];
  if(name==='close'&&st.inModal&&st.wait!=='close'){while(tutI>0&&!(TUT[tutI].wait||'').startsWith('open:'))tutI--;showTut();return}
  if(st.wait!==name)return;
  if(st.ok)toast(st.ok,'#8DEB9E');
  const i=tutI;document.querySelectorAll('.spot').forEach(e=>e.classList.remove('spot'));
  setTimeout(()=>{if(tutI===i){tutI++;showTut()}},600);
}

const SPEEDS=[1,2,4,8,16,32];
let autoSlow=null; // the speed to go back to after danger passes
let seenThreats=new Set(); // dangers we already slowed down for
function threatKeys(){const k=[];if(W.aliens.length||W.spawn.length)k.push('aliens');if(S.dis)k.push(S.dis.kind);return k}
function threat(){return threatKeys().length>0}
function newThreat(){return threatKeys().some(k=>!seenThreats.has(k))}
function speedLabel(){return autoSlow!==null?'1x ('+autoSlow+'x)':'SPEED '+S.speed+'x'}
function setSpeed(v){S.speed=v;$('#cSpd').textContent=speedLabel();$('#cSpd').classList.toggle('on',v===1)}
function checkAutoSpeed(){
  const keys=threatKeys();
  if(keys.some(k=>!seenThreats.has(k))&&S.speed>1){
    if(autoSlow===null)autoSlow=S.speed;setSpeed(1);
    toast('Danger! Time slowed to 1x. Tap SPEED to go faster.','#FFD84A')}
  seenThreats=new Set(keys);
  if(!keys.length&&autoSlow!==null){const v=autoSlow;autoSlow=null;setSpeed(v)}
}
$('#cSpd').onclick=()=>{sfx.click();autoSlow=null;setSpeed(SPEEDS[(SPEEDS.indexOf(S.speed)+1)%SPEEDS.length])};

function fit(){scale=Math.min(innerWidth/1280,innerHeight/720);$('#stage').style.transform=`translate(-50%,-50%) scale(${scale})`}

function skyUpdate(){
  const f=S.t%1;
  let n; if(f<.45)n=0;else if(f<.55)n=(f-.45)/.1;else if(f<.95)n=1;else n=1-(f-.95)/.05;
  $('#skyNight').style.opacity=n;$('#stars').style.opacity=n;$('#nightTint').style.opacity=started&&isOut('power')?Math.min(.85,n*.55+.4):n*.55;
  const sp=f<.5?f/.5:-1, mp=f>=.5?(f-.5)/.5:-1;
  const sun=$('#sun'),moon=$('#moon');
  const arc=p=>`translate(${170+p*820}px,${330-Math.sin(p*Math.PI)*210}px)`;
  if(sp>=0){sun.style.display='block';sun.style.transform=arc(sp)}else sun.style.display='none';
  if(mp>=0){moon.style.display='block';moon.style.transform=arc(mp)}else moon.style.display='none';
}

let last=performance.now(), hudT=0, saveT=0;
function frame(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  const run=started&&!paused&&!modal&&tutI<0&&!MV.on&&!S.over&&!S.won;
  const gs=run?rdt*S.speed:0;
  if(run){const n=Math.ceil(gs/.05);for(let i=0;i<n;i++){if(!run||modal||S.over||S.won)break;simulate(gs/n);combat(gs/n);effects(gs/n,rdt/n);if(S.speed>1&&newThreat())break}checkAutoSpeed()}
  else effects(0,rdt);
  if(started&&!MV.on)MUS.mode=(W.aliens.length||W.spawn.length)?'combat':(threat()||TR_URGENT)?'danger':'calm';
  render();skyUpdate();
  hudT+=rdt;if(hudT>.15&&started){hudT=0;updateHUD()}
  saveT+=rdt;if(saveT>5&&started&&!S.over&&!S.won){saveT=0;save()}
  requestAnimationFrame(frame);
}

async function recordTrailer(){
  const note={set textContent(t){window.__recMsg=t}};
  if(!navigator.mediaDevices||!navigator.mediaDevices.getDisplayMedia||!window.MediaRecorder){note.textContent='This browser cannot record. Open the game in Chrome.';return}
  let stream;
  try{stream=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:30},audio:true,preferCurrentTab:true,selfBrowserSurface:'include'})}
  catch(e){note.textContent='Recording was cancelled or blocked. Click RECORD again and choose This Tab.';return}
  if(!stream.getAudioTracks().length){stream.getTracks().forEach(t=>t.stop());note.textContent='No sound was shared. Click RECORD again and tick Also share tab audio.';return}
  const types=['video/mp4;codecs=avc1.640028,mp4a.40.2','video/mp4;codecs=avc1.42E01E,mp4a.40.2','video/webm;codecs=vp9,opus','video/webm'];
  const mime=types.find(t=>MediaRecorder.isTypeSupported(t))||'';
  const rec=new MediaRecorder(stream,mime?{mimeType:mime,videoBitsPerSecond:6000000}:{});
  const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());
    const ext=(rec.mimeType||'').includes('mp4')?'mp4':'webm',blob=new Blob(chunks,{type:rec.mimeType||'video/webm'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='mars-outpost-trailer.'+ext;document.body.appendChild(a);a.click();a.remove();
    if(/[?&]upload=1/.test(location.search))fetch('/upload?name=mars-outpost-trailer.'+ext,{method:'POST',body:blob}).then(()=>{window.__uploaded=ext}).catch(e=>{window.__uploadErr=String(e)})};
  rec.start();
  const nar=new Audio('narration.wav');
  runTrailer();nar.play().catch(()=>{});
  setTimeout(()=>{try{rec.stop()}catch(e){}},TRAILER_LEN*1000+400);
}
